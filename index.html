<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIPT CUP - Live Scoreboard & vMix Integration</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat Version untuk Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { navy: '#0f172a', red: '#dc2626', silver: '#cbd5e1', dark: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --team-a-color: #dc2626;
            --team-b-color: #2563eb;
            --bg-glass: rgba(15, 23, 42, 0.9);
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Roboto', sans-serif; background-color: #0f172a;
            -webkit-tap-highlight-color: transparent; color: #ffffff;
        }
        body.mode-output { background: transparent !important; overflow: hidden; }
        
        /* Layout Dasar Scoreboard untuk Output / vMix (1280x720 / 1920x1080 Scalable) */
        .scoreboard-root {
            width: 1280px; height: 720px; position: absolute; top: 0; left: 0;
            pointer-events: none; display: flex; justify-content: center;
        }
        
        #preview-container {
            position: relative; width: 100%; aspect-ratio: 16/9;
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                              linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            overflow: hidden; border-radius: 0.5rem; border: 1px solid #334155;
        }

        .sb-main-bar {
            margin-top: 40px; display: flex; align-items: stretch; height: 75px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); border-radius: 8px; overflow: visible;
            border: 2px solid rgba(255,255,255,0.15); background: var(--bg-glass);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        
        .sb-team { display: flex; align-items: center; padding: 0 25px; min-width: 300px; position: relative; overflow: hidden; }
        .sb-team::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%); z-index: 0;
        }
        .sb-team-a { background-color: var(--team-a-color); justify-content: flex-end; }
        .sb-team-b { background-color: var(--team-b-color); justify-content: flex-start; }
        .sb-team-a::before { background: linear-gradient(90deg, rgba(0,0,0,0.4) 0%, rgba(255,255,255,0.1) 100%); }
        
        .sb-team-name {
            font-size: 28px; font-weight: 800; color: #ffffff; z-index: 1;
            text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); white-space: nowrap;
        }
        .sb-team-logo { height: 50px; width: 50px; object-fit: contain; z-index: 1; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5)); }
        .sb-team-a .sb-team-logo { margin-left: 15px; }
        .sb-team-b .sb-team-logo { margin-right: 15px; }
        
        .sb-score-box {
            background: #000000; display: flex; align-items: center; justify-content: center;
            min-width: 85px; font-size: 48px; font-weight: 900; color: #ffffff;
            border-left: 1px solid #333; border-right: 1px solid #333;
            text-shadow: 0px 0px 10px rgba(255,255,255,0.3); font-variant-numeric: tabular-nums;
        }
        
        .sb-center { display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 200px; background: rgba(15, 23, 42, 0.95); position: relative; }
        .sb-timer { font-size: 34px; font-weight: 900; color: #fbbf24; letter-spacing: 2px; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); line-height: 1; margin-top: 4px; }
        .sb-period { font-size: 13px; font-weight: 700; color: #cbd5e1; text-transform: uppercase; letter-spacing: 2px; margin-top: 3px; }
        .sb-live { position: absolute; top: -14px; background: #dc2626; color: white; font-size: 11px; font-weight: 900; padding: 2px 10px; border-radius: 10px; letter-spacing: 2px; animation: pulse-live 2s infinite; }
        
        @keyframes pulse-live { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }
        @keyframes score-pop { 0% { transform: scale(1); color: white; } 50% { transform: scale(1.35); color: #fbbf24; } 100% { transform: scale(1); color: white; } }
        .anim-pop { animation: score-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* Tombol kembali dari uji coba output */
        #btn-back-operator { position: fixed; top: 15px; left: 15px; z-index: 9999; background: #dc2626; color: white; padding: 8px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; display: none; border: 2px solid white; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Tombol Kembali khusus mode test output -->
    <button id="btn-back-operator" onclick="exitTestOutput()">⬅ KEMBALI KE PANEL</button>

    <!-- ==================== PANEL OPERATOR ==================== -->
    <div id="operator-view" class="min-h-screen flex flex-col bg-brand-navy">
        <header class="bg-brand-dark border-b border-gray-700 p-4 flex flex-col sm:flex-row justify-between items-center gap-3 shrink-0">
            <div>
                <h1 class="text-xl font-black tracking-wider text-white">VIPT <span class="text-brand-red">SCOREBOARD</span></h1>
                <p id="sync-status" class="text-[10px] text-yellow-400 tracking-widest uppercase font-bold">● MENYAMBUNG KE SERVER...</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="testFullOutput()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-bold text-xs shadow">TEST OUTPUT</button>
                <button onclick="openOutputTab()" class="bg-brand-red hover:bg-red-700 px-4 py-2 rounded font-bold text-xs shadow">BUKA TAB vMIX OUTPUT</button>
            </div>
        </header>

        <div class="flex flex-col lg:flex-row flex-1 p-4 gap-4 overflow-y-auto">
            <!-- Sidebar Kontrol Operator -->
            <div class="w-full lg:w-[450px] space-y-4 shrink-0">
                
                <!-- 1. PILIH PERTANDINGAN DARI JADWAL -->
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
                    <label class="block text-[11px] font-bold text-gray-400 mb-1">PILIH PERTANDINGAN DARI JADWAL</label>
                    <div class="flex gap-2">
                        <select id="select-match-list" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs font-bold text-white outline-none">
                            <option value="">-- Pilih Pertandingan --</option>
                        </select>
                        <button onclick="applySelectedMatch()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-xs font-black shadow transition whitespace-nowrap">LOAD</button>
                    </div>
                </div>

                <!-- 2. PENGATURAN CABANG & BABAK -->
                <div class="grid grid-cols-2 gap-3 bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1">CABANG OLAHRAGA</label>
                        <select id="inp-sport" onchange="updateSport()" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs font-bold outline-none">
                            <option value="VOLLY PUTRA">VOLLY PUTRA</option>
                            <option value="VOLLY PUTRI">VOLLY PUTRI</option>
                            <option value="FUTSAL">FUTSAL</option>
                            <option value="TENIS MEJA">TENIS MEJA</option>
                            <option value="BADMINTON">BADMINTON</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1">BABAK / PERIODE</label>
                        <input type="text" id="inp-period" oninput="updatePeriod()" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs font-bold uppercase" value="BABAK 8 BESAR">
                    </div>
                </div>

                <!-- 3. KONTROL TIM A & B -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Tim A -->
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 relative">
                        <div class="absolute top-0 left-0 w-full h-1" style="background-color: var(--team-a-color)" id="bar-color-a"></div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1">TIM A (KIRI)</label>
                        <input type="text" id="inp-name-a" oninput="updateTeamData()" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white font-black text-sm mb-2 uppercase text-center" value="RT 09 / RW 014">
                        
                        <div class="flex items-center gap-2 mb-3">
                            <input type="color" id="inp-color-a" onchange="updateTeamData()" class="w-8 h-8 rounded cursor-pointer border-0 bg-transparent">
                            <label class="flex-1 cursor-pointer bg-gray-700 hover:bg-gray-600 rounded py-1.5 px-2 text-center text-[10px] font-bold transition">
                                UPLOAD LOGO
                                <input type="file" class="hidden" accept="image/*" onchange="handleImageUpload(event, 'teamA')">
                            </label>
                        </div>

                        <div class="flex justify-between items-center bg-black/50 p-2 rounded-lg">
                            <button onclick="changeScore('A', -1)" class="w-10 h-10 bg-gray-700 hover:bg-red-800 rounded font-black text-lg">-</button>
                            <span id="op-score-a" class="text-3xl font-black">0</span>
                            <button onclick="changeScore('A', 1)" class="w-10 h-10 bg-gray-700 hover:bg-green-800 rounded font-black text-lg">+</button>
                        </div>
                    </div>

                    <!-- Tim B -->
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 relative">
                        <div class="absolute top-0 left-0 w-full h-1" style="background-color: var(--team-b-color)" id="bar-color-b"></div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1">TIM B (KANAN)</label>
                        <input type="text" id="inp-name-b" oninput="updateTeamData()" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white font-black text-sm mb-2 uppercase text-center" value="RT 08 / RW 014">
                        
                        <div class="flex items-center gap-2 mb-3">
                            <input type="color" id="inp-color-b" onchange="updateTeamData()" class="w-8 h-8 rounded cursor-pointer border-0 bg-transparent">
                            <label class="flex-1 cursor-pointer bg-gray-700 hover:bg-gray-600 rounded py-1.5 px-2 text-center text-[10px] font-bold transition">
                                UPLOAD LOGO
                                <input type="file" class="hidden" accept="image/*" onchange="handleImageUpload(event, 'teamB')">
                            </label>
                        </div>

                        <div class="flex justify-between items-center bg-black/50 p-2 rounded-lg">
                            <button onclick="changeScore('B', -1)" class="w-10 h-10 bg-gray-700 hover:bg-red-800 rounded font-black text-lg">-</button>
                            <span id="op-score-b" class="text-3xl font-black">0</span>
                            <button onclick="changeScore('B', 1)" class="w-10 h-10 bg-gray-700 hover:bg-green-800 rounded font-black text-lg">+</button>
                        </div>
                    </div>
                </div>

                <!-- 4. TIMER KONTROL -->
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center shadow-md">
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">TIMER PERTANDINGAN</label>
                    <div class="text-4xl font-black text-amber-400 mb-3 font-mono" id="op-timer-display">10:00</div>
                    
                    <div class="grid grid-cols-5 gap-1 mb-3">
                        <button onclick="modifyTimer(-60)" class="bg-gray-700 hover:bg-gray-600 rounded py-1 text-xs font-bold">-1M</button>
                        <button onclick="modifyTimer(-10)" class="bg-gray-700 hover:bg-gray-600 rounded py-1 text-xs font-bold">-10S</button>
                        <button onclick="resetTimer()" class="bg-gray-700 hover:bg-red-900 rounded py-1 text-xs font-bold text-red-400">RST</button>
                        <button onclick="modifyTimer(10)" class="bg-gray-700 hover:bg-gray-600 rounded py-1 text-xs font-bold">+10S</button>
                        <button onclick="modifyTimer(60)" class="bg-gray-700 hover:bg-gray-600 rounded py-1 text-xs font-bold">+1M</button>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="startTimer()" id="btn-start" class="flex-1 bg-green-600 hover:bg-green-500 py-2.5 rounded font-black text-sm shadow">START</button>
                        <button onclick="pauseTimer()" id="btn-pause" class="flex-1 bg-amber-600 hover:bg-amber-500 py-2.5 rounded font-black text-sm shadow hidden">PAUSE</button>
                    </div>
                </div>

            </div>

            <!-- Preview Live Area -->
            <div class="flex-1 bg-black/60 p-4 rounded-xl border border-gray-800 flex flex-col justify-center items-center">
                <div class="w-full max-w-3xl">
                    <span class="text-xs text-gray-400 font-bold block mb-2">● LIVE PREVIEW 16:9</span>
                    <div id="preview-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== TEMPLATE SCOREBOARD LAYOUT ==================== -->
    <div id="scoreboard-template" style="display: none;">
        <div class="scoreboard-root" id="sb-root">
            <div class="sb-main-bar">
                <div class="sb-team sb-team-a" id="ui-team-a-bg">
                    <div class="sb-team-name" id="ui-team-a-name">TEAM A</div>
                    <img id="ui-team-a-logo" class="sb-team-logo" src="" style="display:none;">
                </div>
                <div class="sb-score-box" id="ui-score-a">0</div>
                <div class="sb-center">
                    <div class="sb-live" id="ui-live-badge">LIVE</div>
                    <div class="sb-timer" id="ui-timer">10:00</div>
                    <div class="sb-period" id="ui-period">BABAK 8 BESAR</div>
                </div>
                <div class="sb-score-box" id="ui-score-b">0</div>
                <div class="sb-team sb-team-b" id="ui-team-b-bg">
                    <img id="ui-team-b-logo" class="sb-team-logo" src="" style="display:none;">
                    <div class="sb-team-name" id="ui-team-b-name">TEAM B</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tampilan khusus vMix Output -->
    <div id="output-view" class="hidden h-screen w-screen overflow-hidden relative"></div>

    <!-- ==================== LOGIC JAVASCRIPT ==================== -->
    <script>
        // Data Jadwal Resmi VIPT CUP IV 2026
        const VIPT_MATCHES = [
          {id:"VP-8B1", sport:"VOLLY PUTRA", round:"BABAK 8 BESAR", a:"RT 09 / RW 014", b:"RT 08 / RW 014"},
          {id:"VP-8B2", sport:"VOLLY PUTRA", round:"BABAK 8 BESAR", a:"RT 02 / RW 021", b:"RT 04 / RW 021"},
          {id:"VP-8B3", sport:"VOLLY PUTRA", round:"BABAK 8 BESAR", a:"RT 10 / RW 021", b:"RT 08 / RW 021"},
          {id:"VP-8B4", sport:"VOLLY PUTRA", round:"BABAK 8 BESAR", a:"RT 06 / RW 021", b:"RT 07 / RW 021"},
          {id:"VW-SF1", sport:"VOLLY PUTRI", round:"BABAK SEMIFINAL", a:"RT 09 / RW 014", b:"RT 08 / RW 014"},
          {id:"VW-SF2", sport:"VOLLY PUTRI", round:"BABAK SEMIFINAL", a:"RT 06 / RW 021", b:"RT 08 / RW 021"},
          {id:"FS-SF1", sport:"FUTSAL", round:"BABAK SEMIFINAL", a:"RT 13 / RW 021", b:"RT 04 / RW 021"},
          {id:"FS-SF2", sport:"FUTSAL", round:"BABAK SEMIFINAL", a:"RT 11 / RW 021", b:"RT 02 / RW 021"},
          {id:"TM-1", sport:"TENIS MEJA", round:"BABAK SEMIFINAL", a:"RT 08 / RW 014", b:"RT 10 / RW 014"},
          {id:"TM-2", sport:"TENIS MEJA", round:"BABAK SEMIFINAL", a:"RT 11 / RW 021", b:"RT 08 / RW 021"},
          {id:"BD-1", sport:"BADMINTON", round:"BABAK SEMIFINAL (PUTRI)", a:"RT 10 / RW 021", b:"RT 13 / RW 021"},
          {id:"BD-2", sport:"BADMINTON", round:"BABAK SEMIFINAL (PUTRA)", a:"RT 06 / RW 021", b:"RT 08 / RW 021"},
          {id:"BD-3", sport:"BADMINTON", round:"BABAK SEMIFINAL (PUTRA)", a:"RT 11 / RW 021", b:"RT 08 / RW 014"}
        ];

        let state = {
            matchId: "VP-8B1",
            sport: 'VOLLY PUTRA',
            period: 'BABAK 8 BESAR',
            timer: 600,
            timerRunning: false,
            teamA: { name: 'RT 09 / RW 014', score: 0, logo: '', color: '#dc2626' },
            teamB: { name: 'RT 08 / RW 014', score: 0, logo: '', color: '#2563eb' }
        };

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBIww6sg-mRtUUx3rIylnu6qfYG6Ahfih8",
            authDomain: "scorebordviptcup.firebaseapp.com",
            databaseURL: "https://scorebordviptcup-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "scorebordviptcup"
        };

        let firebaseReady = false;
        let firebaseDb = null;
        let firebaseRef = null;
        let isOutputMode = false;
        let timerInterval = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            isOutputMode = urlParams.get('mode') === 'output';

            populateMatchDropdown();
            initFirebase();

            if (isOutputMode) {
                initOutputMode();
            } else {
                initOperatorMode();
            }
        }

        function populateMatchDropdown() {
            const select = document.getElementById('select-match-list');
            if (!select) return;
            VIPT_MATCHES.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = `[${m.sport}] ${m.a} vs ${m.b}`;
                select.appendChild(opt);
            });
        }

        window.applySelectedMatch = function() {
            const id = document.getElementById('select-match-list').value;
            if (!id) return alert("Pilih pertandingan terlebih dahulu!");
            const match = VIPT_MATCHES.find(m => m.id === id);
            if (match) {
                state.matchId = match.id;
                state.sport = match.sport;
                state.period = match.round;
                state.teamA.name = match.a;
                state.teamB.name = match.b;
                state.teamA.score = 0;
                state.teamB.score = 0;
                syncAndSave();
            }
        }

        async function initFirebase() {
            try {
                if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
                await firebase.auth().signInAnonymously();
                firebaseDb = firebase.database();
                firebaseRef = firebaseDb.ref('vipt_scoreboard/live');
                firebaseReady = true;

                firebaseRef.on('value', (snapshot) => {
                    const remote = snapshot.val();
                    if (!remote) {
                        firebaseRef.set(state);
                        return;
                    }
                    state = remote;
                    if (!isOutputMode) updateOperatorUI();
                    renderScoreboard();
                });

                document.getElementById('sync-status').textContent = '● ONLINE (REALTIME SYNC)';
                document.getElementById('sync-status').className = 'text-[10px] text-green-400 font-bold tracking-widest';
            } catch (e) {
                console.error("Firebase Error:", e);
                document.getElementById('sync-status').textContent = '● OFFLINE / LOCAL MODE';
            }
        }

        function initOperatorMode() {
            document.getElementById('operator-view').classList.remove('hidden');
            document.getElementById('preview-container').innerHTML = document.getElementById('scoreboard-template').innerHTML;
            window.addEventListener('resize', resizePreview);
            resizePreview();
            updateOperatorUI();
            renderScoreboard();
        }

        function initOutputMode() {
            document.getElementById('output-view').classList.remove('hidden');
            document.body.classList.add('mode-output');
            document.getElementById('output-view').innerHTML = document.getElementById('scoreboard-template').innerHTML;
            renderScoreboard();
        }

        window.testFullOutput = function() {
            document.getElementById('operator-view').classList.add('hidden');
            document.getElementById('output-view').classList.remove('hidden');
            document.getElementById('btn-back-operator').style.display = 'block';
            document.body.classList.add('mode-output');
            isOutputMode = true;
            document.getElementById('output-view').innerHTML = document.getElementById('scoreboard-template').innerHTML;
            renderScoreboard();
        }

        window.exitTestOutput = function() {
            document.getElementById('operator-view').classList.remove('hidden');
            document.getElementById('output-view').classList.add('hidden');
            document.getElementById('btn-back-operator').style.display = 'none';
            document.body.classList.remove('mode-output');
            isOutputMode = false;
            renderScoreboard();
            resizePreview();
        }

        window.renderScoreboard = function() {
            const rootId = isOutputMode ? 'output-view' : 'preview-container';
            const root = document.getElementById(rootId);
            if (!root) return;

            const setVal = (id, val) => { const el = root.querySelector('#' + id); if(el) el.textContent = val; };
            const setCSS = (id, prop, val) => { const el = root.querySelector('#' + id); if(el) el.style[prop] = val; };
            const setImg = (id, src) => { 
                const el = root.querySelector('#' + id); 
                if(el) { 
                    if(src) { el.src = src; el.style.display = 'block'; } 
                    else { el.style.display = 'none'; } 
                } 
            };

            setVal('ui-team-a-name', state.teamA.name);
            setVal('ui-team-b-name', state.teamB.name);
            setVal('ui-period', state.period);
            setVal('ui-timer', formatTime(state.timer));

            const sa = root.querySelector('#ui-score-a');
            const sb = root.querySelector('#ui-score-b');
            if (sa && parseInt(sa.textContent) !== state.teamA.score) {
                sa.textContent = state.teamA.score;
                sa.classList.remove('anim-pop'); void sa.offsetWidth; sa.classList.add('anim-pop');
            }
            if (sb && parseInt(sb.textContent) !== state.teamB.score) {
                sb.textContent = state.teamB.score;
                sb.classList.remove('anim-pop'); void sb.offsetWidth; sb.classList.add('anim-pop');
            }

            setCSS('ui-team-a-bg', 'backgroundColor', state.teamA.color);
            setCSS('ui-team-b-bg', 'backgroundColor', state.teamB.color);
            setImg('ui-team-a-logo', state.teamA.logo);
            setImg('ui-team-b-logo', state.teamB.logo);

            const badge = root.querySelector('#ui-live-badge');
            if(badge) badge.style.display = state.timerRunning ? 'block' : 'none';
        }

        function updateOperatorUI() {
            document.getElementById('inp-sport').value = state.sport;
            document.getElementById('inp-period').value = state.period;
            
            const na = document.getElementById('inp-name-a'); if(document.activeElement !== na) na.value = state.teamA.name;
            document.getElementById('inp-color-a').value = state.teamA.color;
            document.getElementById('bar-color-a').style.backgroundColor = state.teamA.color;
            document.getElementById('op-score-a').textContent = state.teamA.score;

            const nb = document.getElementById('inp-name-b'); if(document.activeElement !== nb) nb.value = state.teamB.name;
            document.getElementById('inp-color-b').value = state.teamB.color;
            document.getElementById('bar-color-b').style.backgroundColor = state.teamB.color;
            document.getElementById('op-score-b').textContent = state.teamB.score;

            document.getElementById('op-timer-display').textContent = formatTime(state.timer);
            
            document.getElementById('btn-start').style.display = state.timerRunning ? 'none' : 'block';
            document.getElementById('btn-pause').style.display = state.timerRunning ? 'block' : 'none';
        }

        function resizePreview() {
            if (isOutputMode) return;
            const container = document.getElementById('preview-container');
            const root = container?.querySelector('.scoreboard-root');
            if (!container || !root) return;
            const scale = Math.min(container.clientWidth / 1280, container.clientHeight / 720) * 0.95;
            root.style.transform = `scale(${scale})`;
            root.style.transformOrigin = 'center center';
        }

        window.changeScore = function(team, val) {
            if (team === 'A') state.teamA.score = Math.max(0, state.teamA.score + val);
            if (team === 'B') state.teamB.score = Math.max(0, state.teamB.score + val);
            syncAndSave();
        }

        window.updateTeamData = function() {
            state.teamA.name = document.getElementById('inp-name-a').value;
            state.teamA.color = document.getElementById('inp-color-a').value;
            state.teamB.name = document.getElementById('inp-name-b').value;
            state.teamB.color = document.getElementById('inp-color-b').value;
            syncAndSave();
        }

        window.updateSport = function() {
            state.sport = document.getElementById('inp-sport').value;
            syncAndSave();
        }

        window.updatePeriod = function() {
            state.period = document.getElementById('inp-period').value.toUpperCase();
            syncAndSave();
        }

        function formatTime(s) {
            const m = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }

        window.startTimer = function() {
            if (!state.timerRunning && state.timer > 0) {
                state.timerRunning = true;
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (state.timer > 0) {
                        state.timer--;
                        syncAndSave();
                    } else {
                        window.pauseTimer();
                    }
                }, 1000);
                syncAndSave();
            }
        }

        window.pauseTimer = function() {
            state.timerRunning = false;
            clearInterval(timerInterval);
            syncAndSave();
        }

        window.modifyTimer = function(v) {
            state.timer = Math.max(0, state.timer + v);
            syncAndSave();
        }

        window.resetTimer = function() {
            pauseTimer();
            state.timer = 600; // Default 10 Menit
            syncAndSave();
        }

        window.handleImageUpload = function(e, target) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 200;
                    let w = img.width, h = img.height;
                    if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
                    else if (h > MAX) { w *= MAX / h; h = MAX; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const compressed = canvas.toDataURL('image/png');
                    if (target === 'teamA') state.teamA.logo = compressed;
                    if (target === 'teamB') state.teamB.logo = compressed;
                    syncAndSave();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function syncAndSave() {
            if (!isOutputMode) updateOperatorUI();
            renderScoreboard();
            if (firebaseReady && firebaseRef) {
                firebaseRef.set(state);
            }
        }

        window.openOutputTab = function() {
            const base = window.location.href.split('?')[0];
            window.open(base + '?mode=output', '_blank', 'width=1280,height=720');
        }
    </script>
</body>
</html>
