<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIPT CUP IV 2026 - Match Center & Scoreboard System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: Arial, sans-serif; }
        .mode-output { background: transparent !important; overflow: hidden; }
        .scoreboard-root { width: 1920px; height: 1080px; display: flex; justify-content: center; align-items: flex-start; pointer-events: none; }
        .sb-main-bar {
            margin-top: 70px;
            width: 1760px;
            min-height: 270px;
            display: flex;
            align-items: stretch;
            background: rgba(8, 15, 30, 0.97);
            border: 2px solid rgba(255,255,255,0.16);
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 16px 45px rgba(0,0,0,0.65);
        }
        .sb-team {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 24px 34px;
            width: 540px;
            min-width: 540px;
            font-size: 42px;
            line-height: 1.05;
            font-weight: 900;
            text-transform: uppercase;
            white-space: normal;
            text-align: center;
        }
        .sb-team span { max-width: 285px; }
        .sb-score-box {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 190px;
            min-width: 190px;
            font-size: 116px;
            line-height: 1;
            font-weight: 1000;
            color: #fff;
            text-shadow: 0 3px 12px rgba(255,255,255,0.2);
        }
        .sb-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 260px;
            min-width: 260px;
            background: #020617;
            border-left: 2px solid #333;
            border-right: 2px solid #333;
            padding: 18px;
        }
        .sb-timer { font-size: 52px; font-weight: 1000; color: #fbbf24; }
        .sb-logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            background: rgba(255,255,255,0.04);
            border-radius: 22px;
            padding: 0;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,.45);
        }
        .sport-badge {
            font-size: 22px;
            font-weight: 1000;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 10px;
        }
        .sb-period {
            font-size: 19px;
            font-weight: 900;
            color: #cbd5e1;
            margin-top: 6px;
            text-align: center;
        }
        .sb-vs {
            font-size: 26px;
            font-weight: 1000;
            color: #64748b;
            margin-top: 2px;
        }
    </style>
</head>
<body class="p-2 sm:p-6">

    <!-- TOMBOL KELUAR TAMPILAN vMIX -->
    <button id="btn-back-operator" onclick="exitTestOutput()" style="display:none; position:fixed; top:10px; left:10px; z-index:9999; background:red; padding:10px; font-weight:bold; border-radius:8px;">KEMBALI KE PANEL</button>

    <!-- ==================== PANEL OPERATOR & MATCH CENTER ==================== -->
    <div id="operator-view" class="max-w-2xl mx-auto space-y-4 pb-12">
        
        <!-- MATCH CENTER SELECTOR -->
        <div class="bg-gray-900 border border-amber-500/30 p-4 rounded-2xl shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-lg font-black text-amber-400">VIPT CUP IV 2026 - MATCH CENTER</h1>
                <span class="text-[10px] bg-amber-500/20 text-amber-300 font-bold px-2 py-1 rounded">SINGLE SOURCE BASE</span>
            </div>
            
            <label class="block text-xs font-bold text-gray-300 mb-1">PILIH MATCH DARI MATCH CENTER:</label>
            <div class="flex gap-2 mb-2">
                <select id="select-match-list" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-xl text-xs font-bold text-white"></select>
                <button onclick="loadMatchFromBase()" class="bg-amber-500 hover:bg-amber-600 text-black px-5 py-2.5 rounded-xl font-black text-xs shadow-lg transition">LOAD MATCH</button>
            </div>
        </div>

        <!-- CONTROL PANEL PERTANDINGAN AKTIF -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-gray-400 font-bold mb-1">CABANG OLAHRAGA</label>
                    <select id="select-sport" onchange="changeSport()" class="w-full bg-gray-800 border border-gray-700 p-2 rounded-xl text-xs font-bold text-amber-400">
                        <option value="BADMINTON PUTRA">BADMINTON PUTRA</option>
                        <option value="BADMINTON PUTRI">BADMINTON PUTRI</option>
                        <option value="BADMINTON">BADMINTON (UMUM)</option>
                        <option value="VOLLY PUTRA">VOLLY PUTRA</option>
                        <option value="VOLLY PUTRI">VOLLY PUTRI</option>
                        <option value="FUTSAL">FUTSAL</option>
                        <option value="SEPAK BOLA">SEPAK BOLA</option>
                        <option value="TENIS MEJA">TENIS MEJA</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 font-bold mb-1">STATUS MATCH</label>
                    <select id="select-status" onchange="syncToFirebase()" class="w-full bg-gray-800 border border-gray-700 p-2 rounded-xl text-xs font-bold text-emerald-400">
                        <option value="LIVE">LIVE SEKARANG</option>
                        <option value="JADWAL">BELUM MULAI</option>
                        <option value="SELESAI">SELESAI</option>
                    </select>
                </div>
            </div>

            <!-- PERIODE / GAME -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="changePeriod(-1)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-bold text-xs">- PERIODE</button>
                <div id="period-label" class="bg-black/50 border border-gray-800 rounded-xl flex items-center justify-center text-xs font-black text-amber-400">GAME 1</div>
                <button onclick="changePeriod(1)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-bold text-xs">+ PERIODE</button>
            </div>
        </div>

        <!-- SKOR TIM A & B -->
        <div class="grid grid-cols-2 gap-3">
            <!-- TIM A -->
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl flex flex-col justify-between">
                <div>
                    <p class="text-[10px] font-bold text-red-400 mb-1">TIM A (KIRI)</p>
                    <input type="text" id="inp-name-a" oninput="syncToFirebase()" class="w-full bg-gray-800 border border-gray-700 p-2 mb-2 rounded-xl text-xs font-bold" placeholder="Nama Tim A">
                    <img id="preview-logo-a" class="w-12 h-12 object-contain bg-white/10 rounded-lg mx-auto mb-2 hidden">
                </div>
                <div class="text-center bg-black/40 py-3 rounded-xl border border-gray-800 mb-3">
                    <span id="op-score-a" class="text-4xl font-black text-red-500">0</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="changeScore('A', -1)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-black text-sm">-1</button>
                    <button onclick="changeScore('A', 1)" class="bg-red-600 hover:bg-red-500 py-2 rounded-xl font-black text-sm">+1</button>
                </div>
            </div>

            <!-- TIM B -->
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl flex flex-col justify-between">
                <div>
                    <p class="text-[10px] font-bold text-blue-400 mb-1">TIM B (KANAN)</p>
                    <input type="text" id="inp-name-b" oninput="syncToFirebase()" class="w-full bg-gray-800 border border-gray-700 p-2 mb-2 rounded-xl text-xs font-bold" placeholder="Nama Tim B">
                    <img id="preview-logo-b" class="w-12 h-12 object-contain bg-white/10 rounded-lg mx-auto mb-2 hidden">
                </div>
                <div class="text-center bg-black/40 py-3 rounded-xl border border-gray-800 mb-3">
                    <span id="op-score-b" class="text-4xl font-black text-blue-500">0</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="changeScore('B', -1)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-black text-sm">-1</button>
                    <button onclick="changeScore('B', 1)" class="bg-blue-600 hover:bg-blue-500 py-2 rounded-xl font-black text-sm">+1</button>
                </div>
            </div>
        </div>

        <!-- TIMER KONTROL -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-amber-400">TIMER / WAKTU</span>
                <span id="op-timer-display" class="text-lg font-black text-amber-300">10:00</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="toggleTimer()" id="btn-timer-toggle" class="bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl font-bold text-xs">MULAI</button>
                <button onclick="resetTimer()" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-bold text-xs">RESET 10M</button>
                <button onclick="adjustTimer(60)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-bold text-xs">+1 Menit</button>
            </div>
        </div>

        <!-- NAVIGASI AKSI -->
        <div class="space-y-2">
            <button onclick="openOutputTab()" class="w-full bg-gradient-to-r from-red-600 to-rose-700 hover:opacity-90 py-3 rounded-2xl font-black text-xs shadow-lg">BUKA TAMPILAN vMIX OUTPUT</button>
            <button onclick="finishAndSaveMatch()" class="w-full bg-emerald-700 hover:bg-emerald-600 py-3 rounded-2xl font-black text-xs shadow-lg">SIMPAN HASIL MATCH KE BASE MATCH CENTER</button>
        </div>
    </div>

    <!-- ==================== SCOREBOARD vMIX OUTPUT ==================== -->
    <div id="output-view" class="hidden">
        <div class="scoreboard-root">
            <div class="sb-main-bar">
                <div class="sb-team" style="background:#b91c1c">
                    <img id="ui-logo-a" class="sb-logo" src="" style="display:none">
                    <span id="ui-team-a">TIM A</span>
                </div>

                <div id="ui-score-a" class="sb-score-box">0</div>

                <div class="sb-center">
                    <div id="ui-sport" class="sport-badge">BADMINTON PUTRA</div>
                    <div id="ui-timer" class="sb-timer">10:00</div>
                    <div id="ui-period" class="sb-period">GAME 1</div>
                    <div class="sb-vs">VS</div>
                </div>

                <div id="ui-score-b" class="sb-score-box">0</div>

                <div class="sb-team" style="background:#1d4ed8">
                    <span id="ui-team-b">TIM B</span>
                    <img id="ui-logo-b" class="sb-logo" src="" style="display:none">
                </div>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBIww6sg-mRtUUx3rIylnu6qfYG6Ahfih8",
            authDomain: "scorebordviptcup.firebaseapp.com",
            databaseURL: "https://scorebordviptcup-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "scorebordviptcup",
            storageBucket: "scorebordviptcup.firebasestorage.app",
            messagingSenderId: "1001557073666",
            appId: "1:1001557073666:web:10999e31e2b0c9add4ec1b",
            measurementId: "G-WF9TT9MPNY"
        };

        if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        const dbRef = firebase.database().ref("vipt_scoreboard/live");

        // MASTER BASE DATABASE MATCH CENTER
        const MATCH_CENTER_BASE = [
            { id: "BD-01", sport: "BADMINTON PUTRA", round: "SEMIFINAL", teamA: "RT 10 / RW 021", teamB: "RT 13 / RW 021" },
            { id: "BD-02", sport: "BADMINTON PUTRI", round: "SEMIFINAL", teamA: "RT 08 / RW 014", teamB: "RT 02 / RW 021" },
            { id: "BD-03", sport: "BADMINTON PUTRA", round: "FINAL", teamA: "RT 02 / RW 021", teamB: "RT 08 / RW 014" },
            { id: "VP-01", sport: "VOLLY PUTRA", round: "BABAK 8 BESAR", teamA: "RT 09 / RW 014", teamB: "RT 08 / RW 014" },
            { id: "VP-02", sport: "VOLLY PUTRA", round: "BABAK 8 BESAR", teamA: "RT 02 / RW 021", teamB: "RT 04 / RW 021" },
            { id: "VW-01", sport: "VOLLY PUTRI", round: "SEMIFINAL", teamA: "RT 09 / RW 014", teamB: "RT 08 / RW 014" },
            { id: "FS-01", sport: "FUTSAL", round: "SEMIFINAL", teamA: "RT 13 / RW 021", teamB: "RT 04 / RW 021" },
            { id: "TM-01", sport: "TENIS MEJA", round: "SEMIFINAL", teamA: "RT 08 / RW 014", teamB: "RT 10 / RW 014" }
        ];

        const TEAM_LOGOS = {
            "RT 02/RW 021": "assets/logos/RT_02-RW_021.png",
            "RT 04/RW 021": "assets/logos/RT_04-RW_021.png",
            "RT 06/RW 021": "assets/logos/RT_06-RW_021.png",
            "RT 07/RW 014": "assets/logos/RT_07-RW_014.png",
            "RT 07/RW 021": "assets/logos/RT_07-RW_021.png",
            "RT 08/RW 014": "assets/logos/RT_08-RW_014.png",
            "RT 08/RW 021": "assets/logos/RT_08-RW_021.png",
            "RT 09/RW 014": "assets/logos/RT_09-RW_014.png",
            "RT 10/RW 014": "assets/logos/RT_10-RW_014.png",
            "RT 10/RW 021": "assets/logos/RT_10-RW_021.png",
            "RT 11/RW 021": "assets/logos/RT_11-RW_021.png",
            "RT 13/RW 021": "assets/logos/RT_13-RW_021.png"
        };

        let state = {
            matchId: "BD-01",
            sport: "BADMINTON PUTRA",
            period: "GAME 1",
            periodNumber: 1,
            status: "LIVE",
            timer: 600,
            timerRunning: false,
            teamA: { name: "RT 10 / RW 021", score: 0 },
            teamB: { name: "RT 13 / RW 021", score: 0 }
        };

        let timerInterval = null;

        function initMatchCenterDropdown() {
            const select = document.getElementById('select-match-list');
            select.innerHTML = '';
            MATCH_CENTER_BASE.forEach(m => {
                select.innerHTML += `<option value="${m.id}">[${m.sport}] ${m.teamA} VS ${m.teamB} (${m.round})</option>`;
            });
        }

        function loadMatchFromBase() {
            const selectedId = document.getElementById('select-match-list').value;
            const matchData = MATCH_CENTER_BASE.find(m => m.id === selectedId);
            if(matchData) {
                state.matchId = matchData.id;
                state.sport = matchData.sport;
                state.teamA.name = matchData.teamA;
                state.teamB.name = matchData.teamB;
                state.teamA.score = 0;
                state.teamB.score = 0;
                state.periodNumber = 1;
                state.period = getDefaultPeriod(state.sport);
                state.status = "LIVE";

                updateOperatorUI();
                syncToFirebase();
            }
        }

        function normalizeTeamName(name) {
            return String(name || "").toUpperCase().replace(/[.]/g, "").replace(/\s*\/\s*/g, "/").replace(/\s+/g, " ").trim();
        }

        function getAutoLogo(name) {
            return TEAM_LOGOS[normalizeTeamName(name)] || "";
        }

        function getDefaultPeriod(sport) {
            if (sport === "SEPAK BOLA" || sport === "FUTSAL") return "BABAK 1";
            if (sport.includes("VOLLY")) return "SET 1";
            return "GAME 1";
        }

        function changeSport() {
            state.sport = document.getElementById('select-sport').value;
            state.periodNumber = 1;
            state.period = getDefaultPeriod(state.sport);
            updateOperatorUI();
            syncToFirebase();
        }

        function changePeriod(delta) {
            const max = (state.sport === "SEPAK BOLA" || state.sport === "FUTSAL") ? 2 : (state.sport.includes("VOLLY") ? 5 : 3);
            state.periodNumber = Math.max(1, Math.min(max, (Number(state.periodNumber) || 1) + delta));
            
            if (state.sport === "SEPAK BOLA" || state.sport === "FUTSAL") {
                state.period = "BABAK " + state.periodNumber;
            } else if (state.sport.includes("VOLLY")) {
                state.period = "SET " + state.periodNumber;
            } else {
                state.period = "GAME " + state.periodNumber;
            }

            updateOperatorUI();
            syncToFirebase();
        }

        function changeScore(team, val) {
            if (team === 'A') state.teamA.score = Math.max(0, state.teamA.score + val);
            else state.teamB.score = Math.max(0, state.teamB.score + val);
            updateOperatorUI();
            syncToFirebase();
        }

        function syncToFirebase() {
            state.teamA.name = document.getElementById('inp-name-a').value;
            state.teamB.name = document.getElementById('inp-name-b').value;
            state.status = document.getElementById('select-status').value;
            dbRef.set(state);
        }

        function updateOperatorUI() {
            document.getElementById('select-sport').value = state.sport;
            document.getElementById('select-status').value = state.status;
            document.getElementById('inp-name-a').value = state.teamA.name;
            document.getElementById('inp-name-b').value = state.teamB.name;
            document.getElementById('op-score-a').textContent = state.teamA.score;
            document.getElementById('op-score-b').textContent = state.teamB.score;
            document.getElementById('period-label').textContent = state.period;

            const logoA = getAutoLogo(state.teamA.name);
            const logoB = getAutoLogo(state.teamB.name);

            const prevA = document.getElementById('preview-logo-a');
            const prevB = document.getElementById('preview-logo-b');
            if(logoA) { prevA.src = logoA; prevA.classList.remove('hidden'); } else { prevA.classList.add('hidden'); }
            if(logoB) { prevB.src = logoB; prevB.classList.remove('hidden'); } else { prevB.classList.add('hidden'); }

            updateVmixUI();
        }

        function updateVmixUI() {
            document.getElementById('ui-sport').textContent = state.sport;
            document.getElementById('ui-period').textContent = state.period;
            document.getElementById('ui-score-a').textContent = state.teamA.score;
            document.getElementById('ui-score-b').textContent = state.teamB.score;
            document.getElementById('ui-team-a').textContent = state.teamA.name;
            document.getElementById('ui-team-b').textContent = state.teamB.name;

            const logoAData = getAutoLogo(state.teamA.name);
            const logoBData = getAutoLogo(state.teamB.name);
            const uiLogoA = document.getElementById('ui-logo-a');
            const uiLogoB = document.getElementById('ui-logo-b');

            if(logoAData) { uiLogoA.src = logoAData; uiLogoA.style.display = "block"; } else { uiLogoA.style.display = "none"; }
            if(logoBData) { uiLogoB.src = logoBData; uiLogoB.style.display = "block"; } else { uiLogoB.style.display = "none"; }

            const isCountdown = state.sport === "SEPAK BOLA" || state.sport === "FUTSAL";
            document.getElementById('ui-timer').textContent = isCountdown ? formatTimer(state.timer) : formatLocalClock();
        }

        function formatTimer(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
        }

        function formatLocalClock() {
            return new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
        }

        function toggleTimer() {
            state.timerRunning = !state.timerRunning;
            const btn = document.getElementById('btn-timer-toggle');
            if(state.timerRunning) {
                btn.textContent = "BERHENTI";
                btn.className = "bg-rose-600 hover:bg-rose-500 py-2 rounded-xl font-bold text-xs";
                if(timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if(state.timer > 0) { state.timer--; updateVmixUI(); syncToFirebase(); }
                    else { toggleTimer(); }
                }, 1000);
            } else {
                btn.textContent = "MULAI";
                btn.className = "bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl font-bold text-xs";
                if(timerInterval) clearInterval(timerInterval);
            }
            syncToFirebase();
        }

        function resetTimer() { state.timer = 600; updateVmixUI(); syncToFirebase(); }
        function adjustTimer(sec) { state.timer = Math.max(0, state.timer + sec); updateVmixUI(); syncToFirebase(); }

        function finishAndSaveMatch() {
            if(!confirm("Simpan hasil ke Match Center Base?")) return;
            state.status = "SELESAI";
            syncToFirebase();
            firebase.database().ref("vipt_scoreboard/history").push(state);
            alert("Hasil pertandingan berhasil disimpan!");
        }

        function openOutputTab() { window.open(window.location.href + '?mode=output', '_blank'); }
        function exitTestOutput() { location.reload(); }

        // SYNC REAL-TIME DARI FIREBASE DATABASE
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                state = data;
                updateOperatorUI();
            }
        });

        // DETEKSI MODE OVERLAY vMIX
        if (new URLSearchParams(window.location.search).get('mode') === 'output') {
            document.getElementById('operator-view').classList.add('hidden');
            document.getElementById('output-view').classList.remove('hidden');
            document.getElementById('btn-back-operator').style.display = 'block';
        }

        // INIT DARI MATCH CENTER BASE
        initMatchCenterDropdown();
        updateOperatorUI();
    </script>
</body>
</html>
