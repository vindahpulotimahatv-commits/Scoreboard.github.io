.hidden{

/* =========================
   SCOREBOARD OUTPUT
========================= */

.scoreboard-root{
    width:1280px;
    height:720px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    pointer-events:none;
}

.volly-board{
    width:1080px;
    margin-top:55px;
    background:rgba(8,15,30,.97);
    border:2px solid rgba(255,255,255,.15);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.65);
}

.volly-header{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    background:#020617;
    border-bottom:2px solid #334155;
    font-size:18px;
    font-weight:1000;
}

.volly-sport{
    color:#fbbf24;
}

.volly-status{
    color:#22c55e;
}

.volly-score-row{
    display:grid;
    grid-template-columns:1fr 220px 1fr;
    min-height:230px;
}

.volly-team{
    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

.volly-team-b{

    border-radius:14px;
    padding:4px;
}

.volly-team-name{

    line-height:1.05;
}

.volly-score-center{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#000;
    border-left:2px solid #334155;
    border-right:2px solid #334155;
}

.volly-score{
    font-size:86px;
    line-height:1;
    font-weight:1000;

}

.volly-current-set{
    margin-top:12px;
    padding:7px 22px;
    border-radius:8px;
    background:#111827;

    font-size:22px;

.volly-set-history{

    padding:8px 12px;

    border:1px solid #334155;

.set-history-title{

    font-size:12px;
    font-weight:900;

.set-history-score{
    margin-top:3px;
    font-size:22px;

/* =========================
   OPERATOR
========================= */

.operator-card{

.finished{

<script>

/* =====================================================

===================================================== */

const FIREBASE_CONFIG = {

    apiKey:"AIzaSyBIww6sg-mRtUUx3rIylnu6qfYG6Ahfih8",

    authDomain:"scorebordviptcup.firebaseapp.com",

    databaseURL:"https://scorebordviptcup-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:"scorebordviptcup",

    appId:"1:1001557073666:web:10999e31e2b0c9add4ec1b",

    measurementId:"G-WF9TT9MPNY"

};

if(!firebase.apps.length){
    firebase.initializeApp(FIREBASE_CONFIG);
}

const dbRef =
    firebase.database().ref("vipt_scoreboard/live");

const historyRef =
    firebase.database().ref("vipt_scoreboard/history");


/* =====================================================
   MATCH LIST
===================================================== */

const VIPT_MATCHES = [

    {
        id:"VP-8B1",
        sport:"VOLLY PUTRA",
        round:"BABAK 8 BESAR",
        a:"RT 09 / RW 014",
        b:"RT 08 / RW 014"
    },

    {
        id:"VP-8B2",
        sport:"VOLLY PUTRA",
        round:"BABAK 8 BESAR",
        a:"RT 02 / RW 021",
        b:"RT 04 / RW 021"
    },

    {
        id:"VP-8B3",
        sport:"VOLLY PUTRA",
        round:"BABAK 8 BESAR",
        a:"RT 10 / RW 021",
        b:"RT 08 / RW 021"
    },

    {
        id:"VP-8B4",
        sport:"VOLLY PUTRA",
        round:"BABAK 8 BESAR",
        a:"RT 06 / RW 021",
        b:"RT 07 / RW 021"
    },

    {
        id:"VW-SF1",
        sport:"VOLLY PUTRI",
        round:"BABAK SEMIFINAL",
        a:"RT 09 / RW 014",
        b:"RT 08 / RW 014"
    },

    {
        id:"VW-SF2",
        sport:"VOLLY PUTRI",
        round:"BABAK SEMIFINAL",
        a:"RT 06 / RW 021",
        b:"RT 08 / RW 021"
    }

];


/* =====================================================
   LOGO
===================================================== */

const TEAM_LOGOS = {

    "RT 09/RW 014":"assets/logos/RT_09-RW_014.png",
    "RT 08/RW 014":"assets/logos/RT_08-RW_014.png",

    "RT 02/RW 021":"assets/logos/RT_02-RW_021.png",
    "RT 04/RW 021":"assets/logos/RT_04-RW_021.png",

    "RT 10/RW 021":"assets/logos/RT_10-RW_021.png",

    "RT 06/RW 021":"assets/logos/RT_06-RW_021.png",

    "RT 07/RW 021":"assets/logos/RT_07-RW_021.png",

    "RT 07/RW 014":"assets/logos/RT_07-RW_014.png"

};


function normalizeTeamName(name){

    return String(name || "")
        .toUpperCase()
        .replace(/[.]/g,"")
        .replace(/\s*\/\s*/g,"/")
        .replace(/\s+/g," ")
        .trim();

}


function getLogo(name){

    return TEAM_LOGOS[normalizeTeamName(name)] || "";

}


/* =====================================================
   STATE
===================================================== */

let state = {

    matchId:"",

    sport:"VOLLY PUTRA",

    round:"",

    period:"SET 1",

    periodNumber:1,

    status:"LIVE SEKARANG",

    teamA:{
        name:"TIM A",
        score:0
    },

    teamB:{
        name:"TIM B",
        score:0
    },

    /*
       SEMUA HASIL SET DISIMPAN
    */

    volleyballSets:[

        {
            a:0,
            b:0,
            completed:false
        },

        {
            a:0,
            b:0,
            completed:false
        },

        {
            a:0,
            b:0,
            completed:false
        }

    ],

    currentSet:1,

    winner:"",

    matchFinished:false

};


/* =====================================================
   DROPDOWN
===================================================== */

function populateMatchDropdown(){

    const select =
        document.getElementById("select-match-list");

    select.innerHTML =
        '<option value="">-- PILIH PERTANDINGAN --</option>';

    VIPT_MATCHES.forEach(m=>{

        select.innerHTML += `

            <option value="${m.id}">
                [${m.sport}] ${m.a} vs ${m.b}
            </option>

        `;

    });

}


/* =====================================================
   LOAD MATCH
===================================================== */

function applySelectedMatch(){

    const id =
        document.getElementById("select-match-list").value;

    if(!id) return;

    const match =
        VIPT_MATCHES.find(x=>x.id===id);

    if(!match) return;

    state.matchId = match.id;

    state.sport = match.sport;

    state.round = match.round;

    state.period = "SET 1";

    state.periodNumber = 1;

    state.currentSet = 1;

    state.status = "LIVE SEKARANG";

    state.teamA = {
        name:match.a,
        score:0
    };

    state.teamB = {
        name:match.b,
        score:0
    };

    state.volleyballSets = [

        {
            a:0,
            b:0,
            completed:false
        },

        {
            a:0,
            b:0,
            completed:false
        },

        {
            a:0,
            b:0,
            completed:false
        }

    ];

    state.winner = "";

    state.matchFinished = false;

    updateAll();

    syncToFirebase();

}


/* =====================================================
   CURRENT SET
===================================================== */

function getCurrentSet(){

    if(!state.volleyballSets){
        state.volleyballSets = [];
    }

    if(!state.volleyballSets[state.currentSet-1]){

        state.volleyballSets[state.currentSet-1] = {
            a:0,
            b:0,
            completed:false
        };

    }

    return state.volleyballSets[state.currentSet-1];

}


/* =====================================================
   CHANGE SCORE
===================================================== */

function changeCurrentScore(team,value){

    if(state.matchFinished) return;

    const set =
        getCurrentSet();

    if(team==="A"){

        set.a =
            Math.max(0,set.a + value);

    }else{

        set.b =
            Math.max(0,set.b + value);

    }

    /*
       SCORE BESAR MENGIKUTI SET AKTIF
    */

    state.teamA.score = set.a;

    state.teamB.score = set.b;

    updateAll();

    syncToFirebase();

}


/* =====================================================
   FINISH SET
===================================================== */

function finishCurrentSet(){

    if(state.matchFinished) return;

    const set =
        getCurrentSet();

    if(set.a===set.b){

        alert(
            "Skor set masih sama.\n\n" +
            "Pastikan salah satu tim sudah menang sebelum SET diselesaikan."
        );

        return;

    }


    set.completed = true;


    /*
       SET SELESAI
       SIMPAN SKORNYA
    */

    if(state.currentSet===1){

        state.status = "SET 1 SELESAI";

    }

    if(state.currentSet===2){

        state.status = "SET 2 SELESAI";

    }

    if(state.currentSet===3){

        state.status = "SET 3 SELESAI";

    }


    /*
       JIKA SET 1
       PINDAH KE SET 2
    */

    if(state.currentSet < 3){

        state.currentSet++;

        state.periodNumber =
            state.currentSet;

        state.period =
            "SET " + state.currentSet;

        state.teamA.score = 0;

        state.teamB.score = 0;

        state.status = "LIVE SEKARANG";

    }else{

        /*
           SET 3 SELESAI
           BELUM LANGSUNG MENENTUKAN PEMENANG
           KARENA PEMENANG DIPILIH MANUAL
        */

        state.currentSet = 3;

        state.period = "SET 3";

        state.teamA.score = set.a;

        state.teamB.score = set.b;

    }

    updateAll();

    syncToFirebase();

}


/* =====================================================
   WINNER MANUAL
===================================================== */

function selectWinner(team){

    if(team==="A"){

        state.winner = state.teamA.name;

    }else{

        state.winner = state.teamB.name;

    }

    updateWinnerUI();

    syncToFirebase();

}


/* =====================================================
   FINISH MATCH
===================================================== */

function finishMatch(){

    if(!state.winner){

        alert(
            "Pilih PEMENANG TIM A atau TIM B terlebih dahulu."
        );

        return;

    }


    if(!confirm(
        "Yakin pertandingan selesai?\n\n" +
        "Semua hasil Set 1, Set 2 dan Set 3 akan disimpan ke History."
    )){

        return;

    }


    state.status =
        "PERTANDINGAN SELESAI";

    state.matchFinished = true;

    state.finishedAt =
        new Date().toISOString();


    /*
       SIMPAN KE LIVE
    */

    syncToFirebase();


    /*
       SIMPAN SNAPSHOT HISTORY
    */

    const historyData =
        JSON.parse(
            JSON.stringify(state)
        );

    historyData.savedAt =
        firebase.database.ServerValue.TIMESTAMP;

    historyRef.push(historyData)
        .then(()=>{

            alert(
                "Pertandingan berhasil disimpan.\n\n" +
                "Semua hasil Set 1, Set 2 dan Set 3 tersimpan."
            );

        });

}


/* =====================================================
   FIREBASE SYNC
===================================================== */

function syncToFirebase(){

    state.teamA.name =
        document.getElementById("inp-name-a").value;

    state.teamB.name =
        document.getElementById("inp-name-b").value;


    /*
       Pastikan skor current set selalu sinkron
    */

    if(!state.matchFinished){

        const set =
            getCurrentSet();

        state.teamA.score =
            Number(set.a || 0);

        state.teamB.score =
            Number(set.b || 0);

    }


    dbRef.set(state);

}


/* =====================================================
   UPDATE ALL
===================================================== */

function updateAll(){

    updateOperator();

    updateOutput();

    updateSetHistory();

    updateWinnerUI();

}


/* =====================================================
   OPERATOR UI
===================================================== */

function updateOperator(){

    document.getElementById("inp-name-a").value =
        state.teamA.name || "";

    document.getElementById("inp-name-b").value =
        state.teamB.name || "";


    const set =
        getCurrentSet();


    document.getElementById("op-score-a").textContent =
        set.a;

    document.getElementById("op-score-b").textContent =
        set.b;


    document.getElementById("current-set-label").textContent =
        "SET " + state.currentSet;


    document.getElementById("select-status").value =
        state.status;


    for(let i=0;i<3;i++){

        const item =
            state.volleyballSets[i];

        const el =
            document.getElementById(
                "set-result-"+(i+1)
            );

        if(item.completed){

            el.textContent =
                item.a + " - " + item.b;

        }else{

            el.textContent =
                "-";

        }

    }


    const finishButton =
        document.getElementById("btn-finish-set");


    if(state.currentSet===1){

        finishButton.textContent =
            "SET 1 SELESAI";

    }

    if(state.currentSet===2){

        finishButton.textContent =
            "SET 2 SELESAI";

    }

    if(state.currentSet===3){

        finishButton.textContent =
            "SET 3 SELESAI";

    }


    if(state.matchFinished){

        finishButton.textContent =
            "PERTANDINGAN SUDAH SELESAI";

        finishButton.disabled = true;

        finishButton.classList.add("opacity-50");

    }

}


/* =====================================================
   SET HISTORY OUTPUT
===================================================== */

function updateSetHistory(){

    for(let i=0;i<3;i++){

        const item =
            state.volleyballSets[i];

        const el =
            document.getElementById(
                "out-set-"+(i+1)
            );

        if(!el) continue;

        if(item.completed){

            el.textContent =
                item.a + " - " + item.b;

        }else{

            el.textContent = "-";

        }

    }

}


/* =====================================================
   OUTPUT
===================================================== */

function updateOutput(){

    document.getElementById("out-sport").textContent =
        state.sport || "VOLLY";

    document.getElementById("out-status").textContent =
        state.status || "LIVE SEKARANG";


    document.getElementById("out-team-a").textContent =
        state.teamA.name || "TIM A";

    document.getElementById("out-team-b").textContent =
        state.teamB.name || "TIM B";


    const set =
        getCurrentSet();


    /*
       INI YANG MENJADI SKOR BESAR
       CONTOH:
       10 - 11
    */

    document.getElementById("out-score").textContent =
        set.a + " - " + set.b;


    document.getElementById("out-current-set").textContent =
        "SET " + state.currentSet;


    const logoA =
        getLogo(state.teamA.name);

    const logoB =
        getLogo(state.teamB.name);


    const imgA =
        document.getElementById("out-logo-a");

    const imgB =
        document.getElementById("out-logo-b");


    if(logoA){

        imgA.src = logoA;

        imgA.style.display = "block";

    }else{

        imgA.style.display = "none";

    }


    if(logoB){

        imgB.src = logoB;

        imgB.style.display = "block";

    }else{

        imgB.style.display = "none";

    }


    updateSetHistory();

}


/* =====================================================
   WINNER UI
===================================================== */

function updateWinnerUI(){

    const a =
        document.getElementById("winner-a");

    const b =
        document.getElementById("winner-b");

    const label =
        document.getElementById("winner-label");


    a.classList.remove("winner-selected");

    b.classList.remove("winner-selected");


    if(state.winner===state.teamA.name){

        a.classList.add("winner-selected");

        label.textContent =
            "PEMENANG: " + state.teamA.name;

    }else if(state.winner===state.teamB.name){

        b.classList.add("winner-selected");

        label.textContent =
            "PEMENANG: " + state.teamB.name;

    }else{

        label.textContent =
            "PEMENANG BELUM DIPILIH";

    }

}


/* =====================================================
   FIREBASE LISTENER
===================================================== */

dbRef.on("value",snapshot=>{

    const data =
        snapshot.val();

    if(!data) return;


    state = data;


    if(!state.volleyballSets){

        state.volleyballSets = [

            {
                a:Number(state.teamA?.score || 0),
                b:Number(state.teamB?.score || 0),
                completed:false
            },

            {
                a:0,
                b:0,
                completed:false
            },

            {
                a:0,
                b:0,
                completed:false
            }

        ];

    }


    if(!state.currentSet){

        state.currentSet =
            state.periodNumber || 1;

    }


    updateAll();

});


/* =====================================================
   OUTPUT TAB
===================================================== */

function openOutputTab(){

    window.open(
        window.location.href + "?mode=output",
        "_blank"
    );

}


function exitTestOutput(){

    location.href =
        window.location.pathname;

}


/* =====================================================
   URL MODE
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


if(params.get("mode")==="output"){

    document
        .getElementById("operator-view")
        .classList.add("hidden");

    document
        .getElementById("output-view")
        .classList.remove("hidden");

    document
        .getElementById("btn-back-operator")
        .style.display = "block";

}


/* =====================================================
   INIT
===================================================== */

populateMatchDropdown();

updateAll();

</script>
