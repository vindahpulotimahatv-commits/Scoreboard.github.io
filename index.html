<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIPT CUP IV 2026 - Score Board Volly</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           SCOREBOARD OUTPUT 1280x720
        ========================== */
        .scoreboard-root {
            width: 1280px;
            height: 720px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            pointer-events: none;
            transform: scale(1);
            transform-origin: top left;
        }

        .volly-board {
            width: 1180px;
            margin-top: 45px;
            background: rgba(8, 15, 30, 0.98);
            border: 2px solid rgba(255,255,255,0.16);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.65);
        }

        .volly-header {
            height: 55px;
            background: #020617;
            border-bottom: 2px solid #334155;
            display: grid;
            grid-template-columns: 300px repeat(3, 1fr) 190px;
            align-items: center;
            text-align: center;
        }

        .header-team {
            font-size: 15px;
            font-weight: 1000;
            letter-spacing: 1px;
        }

        .header-set {
            color: #fbbf24;
            font-size: 14px;
            font-weight: 1000;
        }

        .header-status {
            color: #22c55e;
            font-size: 12px;
            font-weight: 1000;
            padding: 5px;
        }

        .volly-row {
            min-height: 145px;
            display: grid;
            grid-template-columns: 300px repeat(3, 1fr) 190px;
            align-items: stretch;
        }

        .volly-team {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 12px;
            font-size: 22px;
            font-weight: 1000;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.1;
        }

        .volly-team-a {
            background: #b91c1c;
        }

        .volly-team-b {
            background: #1d4ed8;
        }

        .volly-team img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            background: white;
            border-radius: 12px;
            padding: 3px;
        }

        .set-score {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            border-left: 2px solid #334155;
            font-size: 58px;
            font-weight: 1000;
        }

        .set-score-a {
            color: #fca5a5;
        }

        .set-score-b {
            color: #93c5fd;
        }

        .match-info {
            background: #000;
            border-left: 2px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-align: center;
        }

        .match-sport {
            color: #fbbf24;
            font-size: 13px;
            font-weight: 1000;
        }

        .match-period {
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 900;
        }

        .match-winner {
            color: #22c55e;
            font-size: 13px;
            font-weight: 1000;
            max-width: 170px;
        }

        .match-status {
            color: #fbbf24;
            font-size: 11px;
            font-weight: 1000;
            text-transform: uppercase;
        }

        .set-finished {
            background: #111827 !important;
        }

        /* =========================
           OPERATOR
        ========================== */
        .operator-card {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,.25);
        }

        .score-big {
            font-size: 44px;
            font-weight: 1000;
        }

        .set-control {
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 12px;
            background: rgba(0,0,0,.25);
        }

        .set-control.active {
            border-color: #fbbf24;
            box-shadow: 0 0 0 1px #fbbf24;
        }

        .set-control.finished {
            border-color: #22c55e;
        }

        .winner-selected {
            border-color: #22c55e !important;
            background: rgba(34,197,94,.15) !important;
        }
    </style>
</head>

<body class="p-2 sm:p-6">

        <!-- PEMENANG MANUAL -->

    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->
    <script>

        /* =========================
           FIREBASE
        ========================== */

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBIww6sg-mRtUUx3rIylnu6qfYG6Ahfih8",
            authDomain: "scorebordviptcup.firebaseapp.com",
            databaseURL: "https://scorebordviptcup-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "scorebordviptcup",
            storageBucket: "scorebordviptcup.firebasestorage.app",
            messagingSenderId: "1001557073666",
            appId: "1:1001557073666:web:10999e31e2b0c9add4ec1b",
            measurementId: "G-WF9TT9MPNY"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(FIREBASE_CONFIG);
        }

        const db = firebase.database();

        const liveRef =
            db.ref("vipt_scoreboard/live");

        const historyRef =
            db.ref("vipt_scoreboard/history");


        /* =========================
           JADWAL
        ========================== */

        const VIPT_MATCHES = [

            {
                id: "VP-8B1",
                sport: "VOLLY PUTRA",
                round: "BABAK 8 BESAR",
                a: "RT 09 / RW 014",
                b: "RT 08 / RW 014"
            },

            {
                id: "VP-8B2",
                sport: "VOLLY PUTRA",
                round: "BABAK 8 BESAR",
                a: "RT 02 / RW 021",
                b: "RT 04 / RW 021"
            },

            {
                id: "VP-8B3",
                sport: "VOLLY PUTRA",
                round: "BABAK 8 BESAR",
                a: "RT 10 / RW 021",
                b: "RT 08 / RW 021"
            },

            {
                id: "VP-8B4",
                sport: "VOLLY PUTRA",
                round: "BABAK 8 BESAR",
                a: "RT 06 / RW 021",
                b: "RT 07 / RW 021"
            },

            {
                id: "VW-SF1",
                sport: "VOLLY PUTRI",
                round: "BABAK SEMIFINAL",
                a: "RT 09 / RW 014",
                b: "RT 08 / RW 014"
            },

            {
                id: "VW-SF2",
                sport: "VOLLY PUTRI",
                round: "BABAK SEMIFINAL",
                a: "RT 06 / RW 021",
                b: "RT 08 / RW 021"
            }

        ];


        /* =========================
           LOGO
        ========================== */

        const TEAM_LOGOS = {

            "RT 02/RW 021":
                "assets/logos/RT_02-RW_021.png",

            "RT 04/RW 021":
                "assets/logos/RT_04-RW_021.png",

            "RT 06/RW 021":
                "assets/logos/RT_06-RW_021.png",

            "RT 07/RW 014":
                "assets/logos/RT_07-RW_014.png",

            "RT 07/RW 021":
                "assets/logos/RT_07-RW_021.png",

            "RT 08/RW 014":
                "assets/logos/RT_08-RW_014.png",

            "RT 08/RW 021":
                "assets/logos/RT_08-RW_021.png",

            "RT 09/RW 014":
                "assets/logos/RT_09-RW_014.png",

            "RT 10/RW 014":
                "assets/logos/RT_10-RW_014.png",

            "RT 10/RW 021":
                "assets/logos/RT_10-RW_021.png",

            "RT 11/RW 021":
                "assets/logos/RT_11-RW_021.png",

            "RT 13/RW 021":
                "assets/logos/RT_13-RW_021.png"

        };


        function normalizeTeamName(name) {

            return String(name || "")
                .toUpperCase()
                .replace(/[.]/g, "")
                .replace(/\s*\/\s*/g, "/")
                .replace(/\s+/g, " ")
                .trim();

        }


        function getLogo(name) {

            return TEAM_LOGOS[
                normalizeTeamName(name)
            ] || "";

        }


        /* =========================
           STATE
        ========================== */

        let state = {

            matchId: "",

            sport: "VOLLY PUTRA",

            round: "BABAK 8 BESAR",

            activeSet: 0,

            period: "SET 1",

            status: "BELUM MULAI",

            winner: "",

            teamA: {
                name: "TIM A"
            },

            teamB: {
                name: "TIM B"
            },

            /*
             * INI DATA UTAMA SCORE VOLLY
             *
             * sets[0] = SET 1
             * sets[1] = SET 2
             * sets[2] = SET 3
             */
            sets: [
                {
                    a: 0,
                    b: 0,
                    finished: false
                },
                {
                    a: 0,
                    b: 0,
                    finished: false
                },
                {
                    a: 0,
                    b: 0,
                    finished: false
                }
            ]

        };


        /* =========================
           NORMALISASI DATA LAMA
        ========================== */

        function ensureSets() {

            if (
                !Array.isArray(state.sets) ||
                state.sets.length !== 3
            ) {

                state.sets = [
                    {
                        a: 0,
                        b: 0,
                        finished: false
                    },
                    {
                        a: 0,
                        b: 0,
                        finished: false
                    },
                    {
                        a: 0,
                        b: 0,
                        finished: false
                    }
                ];

            }

            state.sets =
                state.sets.map(function(set) {

                    return {

                        a: Math.max(
                            0,
                            Number(set?.a) || 0
                        ),

                        b: Math.max(
                            0,
                            Number(set?.b) || 0
                        ),

                        finished:
                            Boolean(set?.finished)

                    };

                });

        }


        /* =========================
           DROPDOWN
        ========================== */

        function populateMatches() {

            const select =
                document.getElementById(
                    "select-match"
                );

            select.innerHTML =
                '<option value="">-- PILIH PERTANDINGAN --</option>';

            VIPT_MATCHES.forEach(function(match) {

                select.innerHTML += `
                    <option value="${match.id}">
                        [${match.sport}]
                        ${match.a} vs ${match.b}
                    </option>
                `;

            });

        }


        /* =========================
           LOAD MATCH
        ========================== */

        function loadMatch() {

            const id =
                document.getElementById(
                    "select-match"
                ).value;

            if (!id) return;

            const match =
                VIPT_MATCHES.find(
                    m => m.id === id
                );

            if (!match) return;

            state.matchId =
                match.id;

            state.sport =
                match.sport;

            state.round =
                match.round;

            state.activeSet =
                0;

            state.period =
                "SET 1";

            state.status =
                "LIVE SEKARANG";

            state.winner =
                "";

            state.teamA = {
                name: match.a
            };

            state.teamB = {
                name: match.b
            };

            state.sets = [

                {
                    a: 0,
                    b: 0,
                    finished: false
                },

                {
                    a: 0,
                    b: 0,
                    finished: false
                },

                {
                    a: 0,
                    b: 0,
                    finished: false
                }

            ];

            updateAll();

            saveFirebase();

        }


        /* =========================
           INPUT TEAM
        ========================== */

        function syncFromInputs() {

            state.teamA.name =
                document.getElementById(
                    "inp-name-a"
                ).value;

            state.teamB.name =
                document.getElementById(
                    "inp-name-b"
                ).value;

            saveFirebase();

            updateOutput();

        }


        /* =========================
           CHANGE SCORE SET
        ========================== */

        function changeSetScore(
            setIndex,
            team,
            value
        ) {

            ensureSets();

            const key =
                team === "A"
                    ? "a"
                    : "b";

            if (
                state.sets[setIndex].finished
            ) {

                alert(
                    "SET ini sudah selesai. Pilih set lain."
                );

                return;

            }

            state.sets[setIndex][key] =
                Math.max(
                    0,
                    Number(
                        state.sets[setIndex][key]
                    ) + value
                );

            state.activeSet =
                setIndex;

            state.period =
                "SET " + (setIndex + 1);

            if (
                state.status === "BELUM MULAI"
            ) {

                state.status =
                    "LIVE SEKARANG";

            }

            updateAll();

            saveFirebase();

        }


        /* =========================
           PILIH SET AKTIF
        ========================== */

        function changeActiveSet() {

            const index =
                Number(
                    document.getElementById(
                        "select-active-set"
                    ).value
                );

            state.activeSet =
                Math.max(
                    0,
                    Math.min(2, index)
                );

            state.period =
                "SET " +
                (state.activeSet + 1);

            if (
                !state.sets[state.activeSet]
                    .finished
            ) {

                state.status =
                    "LIVE SEKARANG";

            }

            updateAll();

            saveFirebase();

        }


        /* =========================
           SELESAIKAN SET
        ========================== */

        function finishSet(index) {

            ensureSets();

            const set =
                state.sets[index];

            if (
                set.a === set.b
            ) {

                alert(
                    "Skor SET belum menentukan pemenang. Skor tidak boleh sama."
                );

                return;

            }

            if (
                !confirm(
                    "Yakin SET " +
                    (index + 1) +
                    " selesai dengan skor " +
                    set.a +
                    " - " +
                    set.b +
                    "?"
                )
            ) {

                return;

            }

            set.finished =
                true;

            state.activeSet =
                Math.min(
                    index + 1,
                    2
                );

            if (index === 0) {

                state.status =
                    "SET 1 SELESAI";

            }

            if (index === 1) {

                state.status =
                    "SET 2 SELESAI";

            }

            if (index === 2) {

                state.status =
                    "SET 3 SELESAI";

            }

            state.period =
                "SET " +
                (state.activeSet + 1);

            updateAll();

            saveFirebase();

        }


        /* =========================
           STATUS MANUAL
        ========================== */

        function changeStatus() {

            state.status =
                document.getElementById(
                    "select-status"
                ).value;

            updateAll();

            saveFirebase();

        }


        /* =========================
           PEMENANG MANUAL
        ========================== */

        function selectWinner(team) {

            if (team === "A") {

                state.winner =
                    state.teamA.name;

            } else {

                state.winner =
                    state.teamB.name;

            }

            updateAll();

            saveFirebase();

        }


        /* =========================
           SELESAI PERTANDINGAN
        ========================== */

        function finishMatch() {

            ensureSets();

            if (!state.winner) {

                alert(
                    "Pilih pemenang pertandingan terlebih dahulu."
                );

                return;

            }

            if (
                !confirm(
                    "Yakin pertandingan selesai?\n\nPemenang: " +
                    state.winner
                )
            ) {

                return;

            }

            state.status =
                "PERTANDINGAN SELESAI";

            state.finishedAt =
                new Date().toISOString();

            updateAll();

            saveFirebase();

            historyRef
                .push(state)
                .then(function() {

                    alert(
                        "Pertandingan selesai dan disimpan ke History."
                    );

                });

        }


        /* =========================
           FIREBASE
        ========================== */

        function saveFirebase() {

            ensureSets();

            /*
             * PENTING:
             *
             * Untuk VOLLY:
             * sets adalah sumber skor utama.
             *
             * Tidak ada teamA.score
             * Tidak ada teamB.score
             * sebagai sumber skor pertandingan.
             */

            liveRef.set({

                matchId:
                    state.matchId,

                sport:
                    state.sport,

                round:
                    state.round,

                activeSet:
                    state.activeSet,

                period:
                    state.period,

                status:
                    state.status,

                winner:
                    state.winner,

                teamA: {
                    name:
                        state.teamA.name
                },

                teamB: {
                    name:
                        state.teamB.name
                },

                sets: state.sets,

                updatedAt:
                    firebase.database.ServerValue.TIMESTAMP

            });

        }


        /* =========================
           UPDATE OPERATOR
        ========================== */

        function updateOperator() {

            ensureSets();

            document.getElementById(
                "inp-name-a"
            ).value =
                state.teamA?.name || "TIM A";

            document.getElementById(
                "inp-name-b"
            ).value =
                state.teamB?.name || "TIM B";

            document.getElementById(
                "select-status"
            ).value =
                state.status ||
                "BELUM MULAI";

            document.getElementById(
                "select-active-set"
            ).value =
                state.activeSet || 0;

            document.getElementById(
                "active-set-label"
            ).textContent =
                "SET " +
                (Number(state.activeSet) + 1) +
                " AKTIF";

            for (
                let i = 0;
                i < 3;
                i++
            ) {

                document.getElementById(
                    "op-set" +
                    (i + 1) +
                    "-a"
                ).textContent =
                    state.sets[i].a;

                document.getElementById(
                    "op-set" +
                    (i + 1) +
                    "-b"
                ).textContent =
                    state.sets[i].b;

                const box =
                    document.getElementById(
                        "set-control-" + i
                    );

                box.classList.toggle(
                    "active",
                    i === Number(state.activeSet)
                );

                box.classList.toggle(
                    "finished",
                    state.sets[i].finished
                );

            }

            document.getElementById(
                "winner-label"
            ).textContent =
                state.winner
                    ? "PEMENANG: " + state.winner
                    : "BELUM ADA PEMENANG";

            document.getElementById(
                "winner-a"
            ).classList.toggle(
                "winner-selected",
                state.winner === state.teamA.name
            );

            document.getElementById(
                "winner-b"
            ).classList.toggle(
                "winner-selected",
                state.winner === state.teamB.name
            );

        }


        /* =========================
           UPDATE OUTPUT
        ========================== */

        function updateOutput() {

            ensureSets();

            document.getElementById(
                "out-team-a"
            ).textContent =
                state.teamA?.name || "TIM A";

            document.getElementById(
                "out-team-a-2"
            ).textContent =
                state.teamA?.name || "TIM A";

            document.getElementById(
                "out-team-b-2"
            ).textContent =
                state.teamB?.name || "TIM B";

            /*
             * HANYA SKOR SET
             */

            document.getElementById(
                "out-a1"
            ).textContent =
                state.sets[0].a;

            document.getElementById(
                "out-a2"
            ).textContent =
                state.sets[1].a;

            document.getElementById(
                "out-a3"
            ).textContent =
                state.sets[2].a;

            document.getElementById(
                "out-b1"
            ).textContent =
                state.sets[0].b;

            document.getElementById(
                "out-b2"
            ).textContent =
                state.sets[1].b;

            document.getElementById(
                "out-b3"
            ).textContent =
                state.sets[2].b;

            document.getElementById(
                "out-status"
            ).textContent =
                state.status || "LIVE SEKARANG";

            document.getElementById(
                "out-period"
            ).textContent =
                state.period || "SET 1";

            document.getElementById(
                "out-winner"
            ).textContent =
                state.winner
                    ? "MENANG: " + state.winner
                    : "-";

            /*
             * LOGO A
             */

            const logoA =
                getLogo(
                    state.teamA?.name
                );

            const imageA =
                document.getElementById(
                    "out-logo-a"
                );

            imageA.src =
                logoA;

            imageA.style.display =
                logoA
                    ? "block"
                    : "none";

            /*
             * LOGO B
             */

            const logoB =
                getLogo(
                    state.teamB?.name
                );

            const imageB =
                document.getElementById(
                    "out-logo-b"
                );

            imageB.src =
                logoB;

            imageB.style.display =
                logoB
                    ? "block"
                    : "none";

            /*
             * WARNA STATUS
             */

            const status =
                document.getElementById(
                    "out-status"
                );

            if (
                state.status ===
                "PERTANDINGAN SELESAI"
            ) {

                status.style.color =
                    "#ef4444";

            } else if (
                state.status.includes("SELESAI")
            ) {

                status.style.color =
                    "#fbbf24";

            } else {

                status.style.color =
                    "#22c55e";

            }

        }


        /* =========================
           UPDATE SEMUA
        ========================== */

        function updateAll() {

            ensureSets();

            updateOperator();

            updateOutput();

        }


        /* =========================
           FIREBASE LISTENER
        ========================== */

        liveRef.on(
            "value",
            function(snapshot) {

                const data =
                    snapshot.val();

                if (!data) return;

                state =
                    data;

                /*
                 * COMPATIBILITY
                 * jika data lama belum punya sets
                 */

                ensureSets();

                if (
                    typeof state.activeSet !==
                    "number"
                ) {

                    state.activeSet = 0;

                }

                updateAll();

            }
        );


        /* =========================
           OUTPUT TAB
        ========================== */

        function openOutput() {

            window.open(
                window.location.href +
                "?mode=output",
                "_blank"
            );

        }


        function exitOutput() {

            window.location.href =
                window.location.pathname;

        }


        /* =========================
           MODE OUTPUT
        ========================== */

        const params =
            new URLSearchParams(
                window.location.search
            );

        if (
            params.get("mode") ===
            "output"
        ) {

            document
                .getElementById(
                    "operator-view"
                )
                .classList.add("hidden");

            document
                .getElementById(
                    "output-view"
                )
                .classList.remove("hidden");

            document
                .getElementById(
                    "btn-back-operator"
                )
                .classList.remove("hidden");

        }


        /* =========================
           START
        ========================== */

        populateMatches();

        ensureSets();

        updateAll();

    </script>

</body>
</html>
