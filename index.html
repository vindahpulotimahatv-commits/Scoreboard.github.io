<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIPT CUP - Official Scoreboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .mode-output { background: transparent !important; overflow: hidden; }
        .scoreboard-root { width: 1280px; height: 720px; display: flex; justify-content: center; align-items: flex-start; pointer-events: none; }
        .sb-main-bar { margin-top: 40px; display: flex; height: 75px; background: rgba(15, 23, 42, 0.95); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; overflow: hidden; }
        .sb-team { display: flex; align-items: center; padding: 0 25px; min-width: 300px; font-weight: 800; text-transform: uppercase; }
        .sb-score-box { background: #000; display: flex; align-items: center; justify-content: center; min-width: 80px; font-size: 40px; font-weight: 900; }
        .sb-center { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 160px; background: #000; border-left: 2px solid #333; border-right: 2px solid #333; }
        .sb-timer { font-size: 28px; font-weight: 900; color: #fbbf24; }
    </style>
</head>
<body>

    <button id="btn-back-operator" onclick="exitTestOutput()" style="display:none; position:fixed; top:10px; left:10px; z-index:9999; background:red; padding:10px;">KEMBALI</button>

    <!-- OPERATOR PANEL -->
    <div id="operator-view" class="p-4 max-w-2xl mx-auto">
        <h1 class="text-xl font-bold mb-4 text-center">PANEL KONTROL VIPT CUP</h1>
        
        <div class="bg-gray-800 p-4 rounded-xl mb-4">
            <label class="block text-xs font-bold mb-2">PILIH PERTANDINGAN</label>
            <div class="flex gap-2">
                <select id="select-match-list" class="w-full bg-gray-900 p-2 rounded text-sm"></select>
                <button onclick="applySelectedMatch()" class="bg-blue-600 px-4 py-2 rounded font-bold text-sm">LOAD</button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-800 p-4 rounded-xl">
                <p class="text-xs font-bold mb-2">TIM A</p>
                <input type="text" id="inp-name-a" oninput="updateTeamData()" class="w-full bg-gray-900 p-2 mb-2 rounded text-sm">
                <div class="flex justify-between items-center">
                    <button onclick="changeScore('A', -1)" class="bg-gray-700 px-4 py-1 rounded">-</button>
                    <span id="op-score-a" class="text-xl font-bold">0</span>
                    <button onclick="changeScore('A', 1)" class="bg-gray-700 px-4 py-1 rounded">+</button>
                </div>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl">
                <p class="text-xs font-bold mb-2">TIM B</p>
                <input type="text" id="inp-name-b" oninput="updateTeamData()" class="w-full bg-gray-900 p-2 mb-2 rounded text-sm">
                <div class="flex justify-between items-center">
                    <button onclick="changeScore('B', -1)" class="bg-gray-700 px-4 py-1 rounded">-</button>
                    <span id="op-score-b" class="text-xl font-bold">0</span>
                    <button onclick="changeScore('B', 1)" class="bg-gray-700 px-4 py-1 rounded">+</button>
                </div>
            </div>
        </div>
        <button onclick="openOutputTab()" class="w-full mt-4 bg-red-600 py-3 rounded-xl font-bold">BUKA vMIX OUTPUT</button>
    </div>

    <!-- VMIX OUTPUT AREA -->
    <div id="output-view" class="hidden">
        <div class="scoreboard-root">
            <div class="sb-main-bar">
                <div id="ui-team-a" class="sb-team" style="background:#dc2626">TIM A</div>
                <div id="ui-score-a" class="sb-score-box">0</div>
                <div class="sb-center">
                    <div id="ui-timer" class="sb-timer">00:00</div>
                    <div id="ui-period" style="font-size:10px">---</div>
                </div>
                <div id="ui-score-b" class="sb-score-box">0</div>
                <div id="ui-team-b" class="sb-team" style="background:#2563eb">TIM B</div>
            </div>
        </div>
    </div>

    <script>
        const VIPT_MATCHES = [
            {id:"", sport:"PILIH", round:"-", a:"...", b:"..."},
            {id:"1", sport:"VOLLY", round:"BABAK 1", a:"RT 09", b:"RT 08"},
            {id:"2", sport:"FUTSAL", round:"BABAK 1", a:"TIM A", b:"TIM B"}
        ];

        let state = { matchId: "", sport: '-', period: '-', teamA: { name: 'BELUM ADA JADWAL', score: 0 }, teamB: { name: 'BELUM ADA JADWAL', score: 0 } };

        function populateMatchDropdown() {
            const select = document.getElementById('select-match-list');
            select.innerHTML = '<option value="">-- BELUM ADA PERTANDINGAN --</option>';
            VIPT_MATCHES.forEach(m => {
                if(!m.id) return;
                select.innerHTML += `<option value="${m.id}">[${m.sport}] ${m.a} vs ${m.b}</option>`;
            });
        }

        window.applySelectedMatch = function() {
            const id = document.getElementById('select-match-list').value;
            if (!id) {
                state = { matchId: "", sport: '-', period: '-', teamA: { name: 'BELUM ADA JADWAL', score: 0 }, teamB: { name: 'BELUM ADA JADWAL', score: 0 } };
            } else {
                const m = VIPT_MATCHES.find(x => x.id === id);
                state = { matchId: m.id, sport: m.sport, period: m.round, teamA: { name: m.a, score: 0 }, teamB: { name: m.b, score: 0 } };
            }
            updateUI();
        }

        window.changeScore = function(t, v) {
            if(t==='A') state.teamA.score = Math.max(0, state.teamA.score + v);
            else state.teamB.score = Math.max(0, state.teamB.score + v);
            updateUI();
        }

        function updateUI() {
            document.getElementById('op-score-a').textContent = state.teamA.score;
            document.getElementById('op-score-b').textContent = state.teamB.score;
            document.getElementById('ui-team-a').textContent = state.teamA.name;
            document.getElementById('ui-team-b').textContent = state.teamB.name;
            document.getElementById('ui-score-a').textContent = state.teamA.score;
            document.getElementById('ui-score-b').textContent = state.teamB.score;
            document.getElementById('ui-period').textContent = state.period;
        }

        window.openOutputTab = function() { window.open(window.location.href + '?mode=output', '_blank'); }
        window.exitTestOutput = function() { location.reload(); }

        // Cek mode output
        if (new URLSearchParams(window.location.search).get('mode') === 'output') {
            document.getElementById('operator-view').classList.add('hidden');
            document.getElementById('output-view').classList.remove('hidden');
        }
        populateMatchDropdown();
    </script>
</body>
</html>
