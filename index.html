<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIPT CUP IV 2026 • Scoreboard & Operator Panel</title>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
:root{--bg:#050505;--gold:#f5b72b;--text:#fff;--muted:#c7c0b2;--green:#1ed393}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);padding:20px}

/* STYLE UNTUK PANEL KONTROL OPERATOR */
#controlPanel{max-width:700px;margin:0 auto 30px auto;background:#11100d;border:2px solid #6f4d13;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#controlPanel h2{color:var(--gold);margin-top:0;font-size:16px;text-align:center;border-bottom:1px solid #3b2b10;padding-bottom:10px}
.control-group{margin-bottom:12px}
.control-group label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.control-group input, .control-group select{width:100%;padding:8px;background:#050505;color:#fff;border:1px solid #6f4d13;border-radius:8px;font-size:12px}
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.team-box{background:#181510;border:1px solid #3b2b10;padding:12px;border-radius:10px;text-align:center}
.score-btns{display:flex;gap:8px;margin-top:8px}
.score-btns button{flex:1;padding:10px;font-weight:bold;border:none;border-radius:6px;cursor:pointer}
.btn-plus{background:var(--gold);color:#000}
.btn-minus{background:#333;color:#fff}
.big-btn{width:100%;padding:12px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin-top:8px;font-size:11px}
.btn-save{background:var(--green);color:#000}
.btn-push{background:linear-gradient(135deg,#f5b72b,#9a650b);color:#000;font-size:13px}

/* STYLE UNTUK TAMPILAN vMix (1280x720 Transparent Overlay) */
#vmixOutput{display:none;width:1280px;height:720px;position:relative;background:transparent;overflow:hidden}
.vmix-container{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:900px;background:rgba(5,5,5,0.92);border:2px solid #8a6118;border-radius:16px;padding:16px 24px;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
.vmix-header{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--gold);margin-bottom:10px;letter-spacing:1px}
.vmix-teams{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;text-align:center;gap:10px}
.vmix-team-name{font-size:18px;font-weight:900;color:#fff}
.vmix-score{font-size:42px;font-weight:900;color:var(--gold);background:#000;border:1px solid #6f4d13;border-radius:10px;padding:5px 0}
.vmix-sets{margin-top:10px;border-top:1px solid #3b2b10;padding-top:8px;display:flex;justify-content:center;gap:20px;font-size:11px;color:var(--muted)}
.vmix-sets b{color:#fff}
</style>
</head>
<body>

<!-- PANEL KONTROL OPERATOR (Tampil di browser biasa) -->
<div id="controlPanel">
  <h2>🎛️ PANEL KONTROL SKOR VIPT CUP (OPERATOR)</h2>
  
  <div class="control-group">
    <label>Cabang Olahraga & Babak:</label>
    <input type="text" id="opSport" value="BADMINTON • REGU PUTRA">
  </div>

  <div class="teams-grid">
    <div class="team-box">
      <label>TIM A (KIRI):</label>
      <input type="text" id="opTeamA" value="RT 08 / RW 021" style="margin-bottom:8px">
      <div style="font-size:24px; font-weight:bold; color:var(--gold);" id="displayScoreA">0</div>
      <div class="score-btns">
        <button class="btn-plus" onclick="changeScore('A', 1)">+ Point</button>
        <button class="btn-minus" onclick="changeScore('A', -1)">-</button>
      </div>
    </div>
    
    <div class="team-box">
      <label>TIM B (KANAN):</label>
      <input type="text" id="opTeamB" value="RT 11 / RW 021" style="margin-bottom:8px">
      <div style="font-size:24px; font-weight:bold; color:var(--gold);" id="displayScoreB">0</div>
      <div class="score-btns">
        <button class="btn-plus" onclick="changeScore('B', 1)">+ Point</button>
        <button class="btn-minus" onclick="changeScore('B', -1)">-</button>
      </div>
    </div>
  </div>

  <div class="control-group">
    <label>Nama Set Berjalan (Contoh: SET 1 / TEAM 1):</label>
    <input type="text" id="opSetName" value="SET 1">
    <button class="big-btn btn-save" onclick="saveSet()">💾 Simpan & Catat Set Ini</button>
  </div>

  <div class="control-group">
    <label>Status Pertandingan:</label>
    <select id="opStatus">
      <option value="LIVE">LIVE (Sedang Berlangsung)</option>
      <option value="SELESAI">SELESAI (Pertandingan Usai)</option>
    </select>
  </div>

  <div class="control-group">
    <label>Tim Pemenang / Lolos (Jika Selesai):</label>
    <input type="text" id="opWinner" placeholder="Contoh: RT 08 / RW 021">
  </div>

  <button class="big-btn btn-push" onclick="syncToFirebase()">🚀 KIRIM UPDATE OTOMATIS KE GITHUB & VMIX</button>
  
  <p style="text-align:center; font-size:10px; color:var(--muted); margin-top:15px;">
    💡 *Tips vMix:* Untuk memasukkan tampilan ini ke vMix, tambahkan Browser Input dengan URL: <br>
    <code>[Link-GitHub-Anda]/index.html?mode=output</code>
  </p>
</div>

<!-- TAMPILAN OUTPUT vMix (1280x720 Transparent) -->
<div id="vmixOutput">
  <div class="vmix-container">
    <div class="vmix-header">
      <span id="vmixSport">BADMINTON • REGU PUTRA</span>
      <span id="vmixStatus" style="color:var(--green)">● LIVE SEKARANG</span>
    </div>
    <div class="vmix-teams">
      <div class="vmix-team-name" id="vmixTeamA">RT 08 / RW 021</div>
      <div class="vmix-score" id="vmixScore">0 - 0</div>
      <div class="vmix-team-name" id="vmixTeamB">RT 11 / RW 021</div>
    </div>
    <div class="vmix-sets" id="vmixSetsContainer">
      <span>Riwayat Set: <b id="vmixSetsText">Belum ada set tercatat</b></span>
    </div>
  </div>
</div>

<script>
// Konfigurasi Firebase Anda
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBIww6sg-mRtUUx3rIylnu6qfYG6Ahfih8",
  authDomain: "scorebordviptcup.firebaseapp.com",
  databaseURL: "https://scorebordviptcup-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "scorebordviptcup",
  storageBucket: "scorebordviptcup.appspot.com",
  messagingSenderId: "1001557073666",
  appId: "1:1001557073666:web:10999e31e2b0c9add4ec1b"
};

firebase.initializeApp(FIREBASE_CONFIG);
const dbRef = firebase.database().ref("vipt_scoreboard/live");

let scoreA = 0, scoreB = 0, setsHistory = [];

// Deteksi Mode: Apakah dibuka sebagai vMix Output (?mode=output) atau Operator Panel
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("mode") === "output") {
  document.getElementById("controlPanel").style.display = "none";
  document.getElementById("vmixOutput").style.display = "block";
  document.body.style.background = "transparent";
  
  // Dengarkan data dari Firebase secara real-time untuk vMix
  dbRef.on("value", snapshot => {
    let data = snapshot.val();
    if (!data) return;
    document.getElementById("vmixSport").textContent = data.sport || "LIVE MATCH";
    document.getElementById("vmixTeamA").textContent = data.teamA?.name || "Tim A";
    document.getElementById("vmixTeamB").textContent = data.teamB?.name || "Tim B";
    document.getElementById("vmixScore").textContent = (data.teamA?.score || 0) + " - " + (data.teamB?.score || 0);
    document.getElementById("vmixStatus").textContent = "● " + (data.status || "LIVE");
    
    if (data.sets && data.sets.length > 0) {
      let setsStr = data.sets.map(s => `${s.name}: (${s.scoreA}-${s.scoreB})`).join(" | ");
      document.getElementById("vmixSetsText").textContent = setsStr;
    }
  });
}

// Fungsi Operator
function changeScore(team, val) {
  if (team === 'A') {
    scoreA = Math.max(0, scoreA + val);
    document.getElementById("displayScoreA").textContent = scoreA;
  } else {
    scoreB = Math.max(0, scoreB + val);
    document.getElementById("displayScoreB").textContent = scoreB;
  }
  syncToFirebase();
}

function saveSet() {
  let setName = document.getElementById("opSetName").value || "SET";
  setsHistory.push({ name: setName, scoreA: scoreA, scoreB: scoreB });
  alert("Set " + setName + " berhasil dicimpan!");
  syncToFirebase();
}

function syncToFirebase() {
  let payload = {
    sport: document.getElementById("opSport").value,
    status: document.getElementById("opStatus").value,
    winner: document.getElementById("opWinner").value,
    teamA: { name: document.getElementById("opTeamA").value, score: scoreA },
    teamB: { name: document.getElementById("opTeamB").value, score: scoreB },
    sets: setsHistory
  };
  
  dbRef.set(payload).catch(err => alert("Gagal memperbarui: " + err.message));
}
</script>

</body>
</html>
