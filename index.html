<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIPT CUP IV 2026 - Panel Kontrol Operator & Scoreboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: Arial, sans-serif; }
        .mode-output { background: transparent !important; overflow: hidden; }
        .scoreboard-root { width: 1280px; height: 720px; display: flex; justify-content: center; align-items: flex-start; pointer-events: none; }
        .sb-main-bar {
            margin-top: 55px;
            width: 1160px;
            min-height: 185px;
            display: flex;
            align-items: stretch;
            background: rgba(8, 15, 30, 0.97);
            border: 3px solid rgba(255,255,255,0.18);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 45px rgba(0,0,0,0.65);
        }
        .sb-team {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px 22px;
            width: 330px;
            min-width: 330px;
            font-size: 30px;
            line-height: 1.05;
            font-weight: 900;
            text-transform: uppercase;
            white-space: normal;
            text-align: center;
        }
        .sb-team span { max-width: 215px; }
        .sb-score-box {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 135px;
            min-width: 135px;
            font-size: 86px;
            line-height: 1;
            font-weight: 1000;
            color: #fff;
            text-shadow: 0 3px 12px rgba(255,255,255,0.2);
        }
        .sb-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 190px;
            min-width: 190px;
            background: #020617;
            border-left: 2px solid #333;
            border-right: 2px solid #333;
            padding: 12px;
        }
        .sb-timer { font-size: 38px; font-weight: 1000; color: #fbbf24; }
        .sb-logo {
            width: 86px;
            height: 86px;
            object-fit: contain;
            background: white;
            border-radius: 14px;
            padding: 5px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,.45);
        }
        .sport-badge {
            font-size: 16px;
            font-weight: 1000;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 7px;
        }
        .sb-period {
            font-size: 14px;
            font-weight: 900;
            color: #cbd5e1;
            margin-top: 6px;
            text-align: center;
        }
        .sb-vs {
            font-size: 20px;
            font-weight: 1000;
            color: #64748b;
            margin-top: 2px;
        }
    </style>
</head>
<body class="p-2 sm:p-6">

    <!-- TOMBOL KELUAR MODE VMIX OUTPUT -->
    <button id="btn-back-operator" onclick="exitTestOutput()" style="display:none; position:fixed; top:10px; left:10px; z-index:9999; background:red; padding:10px; font-weight:bold; border-radius:8px;">KEMBALI KE PANEL</button>

    <!-- ==================== PANEL KONTROL OPERATOR ==================== -->
    <div id="operator-view" class="max-w-xl mx-auto space-y-4 pb-12">
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl">
            <h1 class="text-lg font-black text-center text-amber-400 mb-1">VIPT CUP IV 2026</h1>
            <p class="text-xs text-center text-gray-400 mb-4">PANEL KONTROL OPERATOR & SYNC REAL-TIME</p>
            
            <!-- PILIH PERTANDINGAN -->
            <label class="block text-xs font-bold text-gray-300 mb-2">PILIH PERTANDINGAN DARI JADWAL</label>
            <div class="flex gap-2 mb-3">
                <select id="select-match-list" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-xl text-xs font-bold"></select>
                <button onclick="applySelectedMatch()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl font-bold text-xs shadow-lg transition">LOAD</button>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-gray-400 font-bold mb-1">BABAK / PERIODE</label>
                    <input type="text" id="inp-period" oninput="syncToFirebase()" class="w-full bg-gray-800 border border-gray-700 p-2 rounded-xl text-xs font-bold" value="BABAK 1">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 font-bold mb-1">STATUS MATCH</label>
                    <select id="select-status" onchange="syncToFirebase()" class="w-full bg-gray-800 border border-gray-700 p-2 rounded-xl text-xs font-bold text-emerald-400">
                        <option value="LIVE">LIVE SEKARANG</option>
                        <option value="JADWAL">BELUM MULAI</option>
                        <option value="SELESAI">SELESAI</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- CABOR & LOGO PESERTA -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl">
            <div class="grid grid-cols-1 gap-3">
                <div>
                    <label class="block text-[10px] text-gray-400 font-bold mb-1">CABANG OLAHRAGA / MEKANISME SKOR</label>
                    <select id="select-sport" onchange="changeSport()" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-xl text-xs font-bold">
                        <option value="SEPAK BOLA">SEPAK BOLA — GOAL / 2 BABAK</option>
                        <option value="FUTSAL">FUTSAL — GOAL / 2 BABAK</option>
                        <option value="VOLLY">VOLLY — POIN / SET</option>
                        <option value="BADMINTON">BADMINTON — POIN / GAME</option>
                        <option value="TENIS MEJA">TENIS MEJA / PINGPONG — POIN / GAME</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-black/30 border border-gray-800 rounded-xl p-3 text-center">
                        <label class="block text-[10px] text-gray-400 font-bold mb-2">LOGO TIM A — OTOMATIS</label>
                        <img id="preview-logo-a" class="hidden w-20 h-20 object-contain bg-white rounded-xl p-1 mx-auto shadow-lg">
                        <div id="preview-logo-a-empty" class="text-[10px] text-gray-500">Logo mengikuti nama Team A</div>
                    </div>
                    <div class="bg-black/30 border border-gray-800 rounded-xl p-3 text-center">
                        <label class="block text-[10px] text-gray-400 font-bold mb-2">LOGO TIM B — OTOMATIS</label>
                        <img id="preview-logo-b" class="hidden w-20 h-20 object-contain bg-white rounded-xl p-1 mx-auto shadow-lg">
                        <div id="preview-logo-b-empty" class="text-[10px] text-gray-500">Logo mengikuti nama Team B</div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <button onclick="changePeriod(-1)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-bold text-xs">PERIODE -</button>
                    <div id="period-label" class="bg-black/40 border border-gray-800 rounded-xl flex items-center justify-center text-[10px] font-black text-amber-400">BABAK 1</div>
                    <button onclick="changePeriod(1)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-bold text-xs">PERIODE +</button>
                </div>
            </div>
        </div>

        <!-- KONTROL SKOR TIM A & B -->
        <div class="grid grid-cols-2 gap-3">
            <!-- TIM A -->
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl flex flex-col justify-between">
                <div>
                    <p class="text-[10px] font-bold text-red-400 mb-1">TIM A (KIRI)</p>
                    <input type="text" id="inp-name-a" oninput="syncToFirebase()" class="w-full bg-gray-800 border border-gray-700 p-2 mb-3 rounded-xl text-xs font-bold" placeholder="Nama Tim A">
                </div>
                <div class="text-center bg-black/40 py-3 rounded-xl border border-gray-800 mb-3">
                    <span id="op-score-a" class="text-4xl font-black text-red-500">0</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="changeScore('A', -1)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-black text-sm">-1</button>
                    <button onclick="changeScore('A', 1)" class="bg-red-600 hover:bg-red-500 py-2 rounded-xl font-black text-sm">+1</button>
                </div>
            </div>

            <!-- TIM B -->
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl flex flex-col justify-between">
                <div>
                    <p class="text-[10px] font-bold text-blue-400 mb-1">TIM B (KANAN)</p>
                    <input type="text" id="inp-name-b" oninput="syncToFirebase()" class="w-full bg-gray-800 border border-gray-700 p-2 mb-3 rounded-xl text-xs font-bold" placeholder="Nama Tim B">
                </div>
                <div class="text-center bg-black/40 py-3 rounded-xl border border-gray-800 mb-3">
                    <span id="op-score-b" class="text-4xl font-black text-blue-500">0</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="changeScore('B', -1)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-black text-sm">-1</button>
                    <button onclick="changeScore('B', 1)" class="bg-blue-600 hover:bg-blue-500 py-2 rounded-xl font-black text-sm">+1</button>
                </div>
            </div>
        </div>

        <!-- KONTROL TIMER / WAKTU -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-amber-400">PENGATUR WAKTU (TIMER)</span>
                <span id="op-timer-display" class="text-lg font-black text-amber-300">10:00</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="toggleTimer()" id="btn-timer-toggle" class="bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl font-bold text-xs">MULAI</button>
                <button onclick="resetTimer()" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-bold text-xs">RESET 10M</button>
                <button onclick="adjustTimer(60)" class="bg-gray-800 hover:bg-gray-700 py-2 rounded-xl font-bold text-xs">+1 Menit</button>
            </div>
        </div>

        <!-- TOMBOL AKSI UTAMA -->
        <div class="space-y-2">
            <button onclick="openOutputTab()" class="w-full bg-gradient-to-r from-red-600 to-rose-700 hover:opacity-90 py-3 rounded-2xl font-black text-xs shadow-lg">BUKA TAMPILAN vMIX OUTPUT</button>
            <button onclick="finishAndSaveMatch()" class="w-full bg-emerald-700 hover:bg-emerald-600 py-3 rounded-2xl font-black text-xs shadow-lg">SELESAI & SIMPAN KE HISTORY</button>
        </div>
    </div>

    <!-- ==================== TAMPILAN vMIX OUTPUT (LAYAR SCOREBOARD) ==================== -->
    <div id="output-view" class="hidden">
        <div class="scoreboard-root">
            <div class="sb-main-bar">
                <div class="sb-team" style="background:#b91c1c">
                    <img id="ui-logo-a" class="sb-logo" src="" style="display:none">
                    <span id="ui-team-a">TIM A</span>
                </div>

                <div id="ui-score-a" class="sb-score-box">0</div>

                <div class="sb-center">
                    <div id="ui-sport" class="sport-badge">SEPAK BOLA</div>
                    <div id="ui-timer" class="sb-timer">10:00</div>
                    <div id="ui-period" class="sb-period">BABAK 1</div>
                    <div class="sb-vs">VS</div>
                </div>

                <div id="ui-score-b" class="sb-score-box">0</div>

                <div class="sb-team" style="background:#1d4ed8">
                    <span id="ui-team-b">TIM B</span>
                    <img id="ui-logo-b" class="sb-logo" src="" style="display:none">
                </div>
            </div>
        </div>
    </div>

        function normalizeTeamName(name) {
            return String(name || "")
                .toUpperCase()
                .replace(/[.]/g, "")
                .replace(/\s*\/\s*/g, "/")
                .replace(/\s+/g, " ")
                .trim();
        }

        function getAutoLogoForTeam(name) {
            const key = normalizeTeamName(name);
            return TEAM_LOGOS[key] || "";
        }

        let state = {
            matchId: "",
            sport: "SEPAK BOLA",
            period: "BABAK 1",
            periodNumber: 1,
            logos: { a: "", b: "" },
            status: "LIVE",
            timer: 600,
            timerRunning: false,
            teamA: { name: "BELUM ADA JADWAL", score: 0 },
            teamB: { name: "BELUM ADA JADWAL", score: 0 }
        };

        let timerInterval = null;

        function populateMatchDropdown() {
            const select = document.getElementById('select-match-list');
            select.innerHTML = '<option value="">-- PILIH PERTANDINGAN (KOSONG) --</option>';
            VIPT_MATCHES.forEach(m => {
                if(!m.id) return;
                select.innerHTML += `<option value="${m.id}">[${m.sport}] ${m.a} vs ${m.b}</option>`;
            });
        }

        function applySelectedMatch() {
            const id = document.getElementById('select-match-list').value;
            if (!id) {
                state.matchId = "";
                state.sport = "SEPAK BOLA";
                state.period = "BABAK 1";
                state.periodNumber = 1;
                state.logos = { a: "", b: "" };
                localStorage.removeItem("VIPT_LOGO_A");
                localStorage.removeItem("VIPT_LOGO_B");
                state.status = "JADWAL";
                state.teamA = { name: "BELUM ADA JADWAL", score: 0 };
                state.teamB = { name: "BELUM ADA JADWAL", score: 0 };
            } else {
                const m = VIPT_MATCHES.find(x => x.id === id);
                state.matchId = m.id;
                state.sport = normalizeSport(m.sport);
                state.periodNumber = 1;
                state.period = getDefaultPeriod(state.sport);
                state.logos = { a: "", b: "" };
                localStorage.removeItem("VIPT_LOGO_A");
                localStorage.removeItem("VIPT_LOGO_B");
                state.status = "LIVE";
                state.teamA = { name: m.a, score: 0 };
                state.teamB = { name: m.b, score: 0 };
            }
            updateOperatorInputs();
            updateVmixOutputFromState();
            syncToFirebase();
        }

        function normalizeSport(sport) {
            const s = String(sport || "").toUpperCase();
            if (s.includes("VOLLY") || s.includes("VOLLEY")) return "VOLLY";
            if (s.includes("BADMINTON")) return "BADMINTON";
            if (s.includes("TENIS MEJA") || s.includes("PINGPONG") || s.includes("PINGPONG")) return "TENIS MEJA";
            if (s.includes("FUTSAL")) return "FUTSAL";
            return "SEPAK BOLA";
        }

        function getDefaultPeriod(sport) {
            sport = normalizeSport(sport);
            if (sport === "SEPAK BOLA" || sport === "FUTSAL") return "BABAK 1";
            if (sport === "VOLLY") return "SET 1";
            return "GAME 1";
        }

        function getScoreUnit() {
            const sport = normalizeSport(state.sport);
            if (sport === "SEPAK BOLA" || sport === "FUTSAL") return "GOAL";
            return "POIN";
        }

        function updateSportUI() {
            const sport = normalizeSport(state.sport);
            const unit = getScoreUnit();

            document.getElementById('select-sport').value = sport;
            document.getElementById('period-label').textContent = state.period;
            document.getElementById('ui-sport').textContent = sport;
        }

        function changeSport() {
            state.sport = normalizeSport(document.getElementById('select-sport').value);
            state.periodNumber = 1;
            state.period = getDefaultPeriod(state.sport);
            state.teamA.score = 0;
            state.teamB.score = 0;
            updateOperatorInputs();
            updateVmixOutputFromState();
            updateSportUI();
            syncToFirebase();
        }

        function changePeriod(delta) {
            const sport = normalizeSport(state.sport);
            const max = (sport === "SEPAK BOLA" || sport === "FUTSAL") ? 2 : 3;
            state.periodNumber = Math.max(1, Math.min(max, (Number(state.periodNumber) || 1) + delta));

            if (sport === "SEPAK BOLA" || sport === "FUTSAL") {
                state.period = "BABAK " + state.periodNumber;
            } else if (sport === "VOLLY") {
                state.period = "SET " + state.periodNumber;
            } else {
                state.period = "GAME " + state.periodNumber;
            }

            updateOperatorInputs();
            updateVmixOutputFromState();
            updateSportUI();
            syncToFirebase();
        }

        function updateLogoOutput() {
            const logoA = document.getElementById('ui-logo-a');
            const logoB = document.getElementById('ui-logo-b');
            const previewA = document.getElementById('preview-logo-a');
            const previewB = document.getElementById('preview-logo-b');
            const emptyA = document.getElementById('preview-logo-a-empty');
            const emptyB = document.getElementById('preview-logo-b-empty');

            // Logo selalu dicari berdasarkan NAMA TIM yang sedang aktif.
            // Karena data logo tertanam di index.html, perubahan pertandingan langsung ikut berubah.
            const logoAData = getAutoLogoForTeam(state.teamA?.name);
            const logoBData = getAutoLogoForTeam(state.teamB?.name);

            if (logoA) {
                if (logoAData) {
                    logoA.src = logoAData;
                    logoA.style.display = "block";
                } else {
                    logoA.removeAttribute("src");
                    logoA.style.display = "none";
                }
            }
            if (logoB) {
                if (logoBData) {
                    logoB.src = logoBData;
                    logoB.style.display = "block";
                } else {
                    logoB.removeAttribute("src");
                    logoB.style.display = "none";
                }
            }

            if (previewA) {
                previewA.src = logoAData;
                previewA.classList.toggle('hidden', !logoAData);
            }
            if (previewB) {
                previewB.src = logoBData;
                previewB.classList.toggle('hidden', !logoBData);
            }
            if (emptyA) emptyA.style.display = logoAData ? 'none' : 'block';
            if (emptyB) emptyB.style.display = logoBData ? 'none' : 'block';
        }

        function getSportDisplayName(sport) {
            const s = String(sport || "").toUpperCase();
            if (s.includes("VOLLY") || s.includes("VOLLEY")) return "VOLLY";
            if (s.includes("BADMINTON")) return "BADMINTON";
            if (s.includes("TENIS MEJA") || s.includes("PINGPONG")) return "TENIS MEJA";
            if (s.includes("FUTSAL")) return "FUTSAL";
            if (s.includes("SEPAK BOLA") || s.includes("SEPAKBOLA")) return "SEPAK BOLA";
            return s || "SEPAK BOLA";
        }

        function updateVmixOutputFromState() {
            const sportText = getSportDisplayName(state.sport);
            const sportEl = document.getElementById('ui-sport');
            const periodEl = document.getElementById('ui-period');
            const timerEl = document.getElementById('ui-timer');
            const scoreAEl = document.getElementById('ui-score-a');
            const scoreBEl = document.getElementById('ui-score-b');
            const teamAEl = document.getElementById('ui-team-a');
            const teamBEl = document.getElementById('ui-team-b');

            if (sportEl) sportEl.textContent = sportText;
            if (periodEl) periodEl.textContent = state.period || getDefaultPeriod(sportText);

            if (scoreAEl) scoreAEl.textContent = Number(state.teamA?.score || 0);
            if (scoreBEl) scoreBEl.textContent = Number(state.teamB?.score || 0);
            if (teamAEl) teamAEl.textContent = state.teamA?.name || "TIM A";
            if (teamBEl) teamBEl.textContent = state.teamB?.name || "TIM B";

            // Logo mengikuti nama Team A / Team B yang sama dengan Live Score.
            updateLogoOutput();

            // Timer hanya ditonjolkan untuk sepak bola/futsal.
            if (timerEl) {
                const isBallSport = sportText === "SEPAK BOLA" || sportText === "FUTSAL";
                timerEl.style.display = isBallSport ? "block" : "none";
            }
        }

        function updateOperatorInputs() {
            document.getElementById('inp-name-a').value = state.teamA.name;
            document.getElementById('inp-name-b').value = state.teamB.name;
            document.getElementById('inp-period').value = state.period;
            document.getElementById('select-status').value = state.status;
            document.getElementById('op-score-a').textContent = state.teamA.score;
            document.getElementById('op-score-b').textContent = state.teamB.score;
            state.sport = normalizeSport(state.sport);
            state.logos = state.logos || {a:"", b:""};
            updateSportUI();
            updateLogoOutput();
        }

        function changeScore(team, val) {
            if (team === 'A') {
                state.teamA.score = Math.max(0, state.teamA.score + val);
                document.getElementById('op-score-a').textContent = state.teamA.score;
            } else {
                state.teamB.score = Math.max(0, state.teamB.score + val);
                document.getElementById('op-score-b').textContent = state.teamB.score;
            }
            syncToFirebase();
        }

        function syncToFirebase() {
            state.teamA.name = document.getElementById('inp-name-a').value;
            state.teamB.name = document.getElementById('inp-name-b').value;
            state.period = document.getElementById('inp-period').value;
            state.status = document.getElementById('select-status').value;
            state.sport = normalizeSport(state.sport);
            // Logo TIDAK disimpan ke Firebase sebagai base64 besar.
            // Semua client mencari logo dari nama tim menggunakan TEAM_LOGOS.
            state.logos = {a:"", b:""};
            updateLogoOutput();

            dbRef.set(state);
        }

        // FUNGSI TIMER
        function formatTimer(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
        }

        function updateTimerDisplay() {
            const timeStr = formatTimer(state.timer);
            document.getElementById('op-timer-display').textContent = timeStr;
            document.getElementById('ui-timer').textContent = timeStr;
        }

        function toggleTimer() {
            state.timerRunning = !state.timerRunning;
            const btn = document.getElementById('btn-timer-toggle');
            if (state.timerRunning) {
                btn.textContent = "BERHENTI";
                btn.className = "bg-rose-600 hover:bg-rose-500 py-2 rounded-xl font-bold text-xs";
                startInterval();
            } else {
                btn.textContent = "MULAI";
                btn.className = "bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl font-bold text-xs";
                stopInterval();
            }
            syncToFirebase();
        }

        function startInterval() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (state.timerRunning && state.timer > 0) {
                    state.timer--;
                    updateTimerDisplay();
                    syncToFirebase();
                } else if (state.timer <= 0 && state.timerRunning) {
                    state.timerRunning = false;
                    toggleTimer();
                }
            }, 1000);
        }

        function stopInterval() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function resetTimer() {
            state.timer = 600;
            state.timerRunning = false;
            updateTimerDisplay();
            syncToFirebase();
        }

        function adjustTimer(sec) {
            state.timer = Math.max(0, state.timer + sec);
            updateTimerDisplay();
            syncToFirebase();
        }

        // SIMPAN KE HISTORY
        function finishAndSaveMatch() {
            if(!confirm("Yakin ingin menyelesaikan pertandingan ini dan menyimpannya ke hasil?")) return;
            state.status = "SELESAI";
            state.timerRunning = false;
            syncToFirebase();

            // Push ke history database
            firebase.database().ref("vipt_scoreboard/history").push(state);
            alert("Pertandingan berhasil disimpan ke Hasil Match Center!");
        }

        function openOutputTab() { window.open(window.location.href + '?mode=output', '_blank'); }
        function exitTestOutput() { location.reload(); }

        // MENDENGARKAN PERUBAHAN DARI DATABASE UNTUK TAMPILAN vMIX
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                state = data;
                updateTimerDisplay();
                document.getElementById('ui-team-a').textContent = state.teamA.name;
                document.getElementById('ui-team-b').textContent = state.teamB.name;
                document.getElementById('ui-score-a').textContent = state.teamA.score;
                document.getElementById('ui-score-b').textContent = state.teamB.score;
                state.sport = normalizeSport(state.sport);
                state.logos = {a:"", b:""};
                updateVmixOutputFromState();
                updateSportUI();
                updateLogoOutput();
            }
        });

        // Cek mode URL apakah vMix output atau operator
        if (new URLSearchParams(window.location.search).get('mode') === 'output') {
            document.getElementById('operator-view').classList.add('hidden');
            document.getElementById('output-view').classList.remove('hidden');
            document.getElementById('btn-back-operator').style.display = 'block';
        }

        populateMatchDropdown();
        state.sport = normalizeSport(state.sport);
        updateOperatorInputs();
        updateTimerDisplay();
        updateVmixOutputFromState();
        updateSportUI();
        updateLogoOutput();
    </script>
</body>
</html>
