<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Controller</title>
    <!-- Firebase SDK (Gunakan versi yang sesuai dengan proyek Anda) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h2>MATCH CONTROLLER</h2>

    <!-- Form Data Pertandingan -->
    <div>
        <label for="inp-name-a">Nama Tim A: </label>
        <input type="text" id="inp-name-a" value="TIM A" onchange="syncToFirebase()"><br><br>

        <label for="inp-name-b">Nama Tim B: </label>
        <input type="text" id="inp-name-b" value="TIM B" onchange="syncToFirebase()"><br><br>

        <label for="select-sport">Cabang Olahraga: </label>
        <select id="select-sport" onchange="syncToFirebase()">
            <option value="BADMINTON">Badminton</option>
            <option value="VOLLY">Voli</option>
            <option value="TENIS MEJA">Tenis Meja</option>
        </select><br><br>

        <label for="inp-period">Babak/Period: </label>
        <input type="text" id="inp-period" value="Set 1" onchange="syncToFirebase()"><br><br>

        <label for="select-status">Status: </label>
        <select id="select-status" onchange="syncToFirebase()">
            <option value="BERJALAN">BERJALAN</option>
            <option value="PAUSE">PAUSE</option>
            <option value="PERTANDINGAN SELESAI">PERTANDINGAN SELESAI</option>
        </select>
    </div>

    <hr>

    <!-- Kontrol Set Aktif -->
    <div>
        <h3>Pilih Set Aktif</h3>
        <button onclick="selectSet(1)">Set 1</button>
        <button onclick="selectSet(2)">Set 2</button>
        <button onclick="selectSet(3)">Set 3</button>
    </div>

    <br>

    <!-- Kontrol Skor Pertandingan -->
    <div>
        <h3>Skor Pertandingan (<span id="current-set-label">Set 1</span>)</h3>
        <div>
            <strong>TIM A: </strong>
            <button onclick="changeScore('A', -1)">-</button>
            <span id="score-a">0</span>
            <button onclick="changeScore('A', 1)">+</button>
            <button onclick="setSetWinner('A')">Menang Set Ini</button>
        </div>
        <br>
        <div>
            <strong>TIM B: </strong>
            <button onclick="changeScore('B', -1)">-</button>
            <span id="score-b">0</span>
            <button onclick="changeScore('B', 1)">+</button>
            <button onclick="setSetWinner('B')">Menang Set Ini</button>
        </div>
    </div>

    <!-- Modul JavaScript di bawah ini -->
    <script>
        // Masukkan JavaScript dari langkah 2 di bawah
    </script>
</body>
</html>
